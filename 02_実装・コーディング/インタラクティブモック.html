<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionSync Analytics - 左右2画面 デュアル動作分析モック</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 最上部 ミニマル情報ヘッダー */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 40;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #top-bar.hidden-ui {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .app-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diff-badge {
      background: rgba(255, 214, 0, 0.15);
      border: 1px solid rgba(255, 214, 0, 0.4);
      color: #FFD600;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      padding: 3px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .top-actions {
      display: flex;
      gap: 8px;
    }
    .top-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }
    .top-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }

    /* メイン 2画面スプリットビューポート (画面全体100%) */
    #viewport-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      background: #05070A;
      cursor: default;
    }

    /* 各画面 (左: 過去大会 / 右: 今回大会) */
    .screen-half {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .screen-half.left-screen {
      border-right: 1px solid rgba(255,255,255,0.15);
    }

    /* 背景の動画映像キャンバス */
    .video-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 映像上のバッジ (動画タイトル・タイムコード) */
    .video-header-badge {
      position: absolute;
      top: 50px;
      left: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.6);
      color: #00E5FF;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
    }
    .video-header-badge.b {
      border-color: rgba(255, 112, 67, 0.7);
      color: #FF7043;
    }
    .video-time-badge {
      position: absolute;
      top: 50px;
      right: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity 0.3s;
    }
    .hidden-ui .video-header-badge,
    .hidden-ui .video-time-badge {
      opacity: 0.2;
    }

    /* 映像の上に直接透過オーバーレイする波形レイヤー */
    .wave-overlay-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.15) 75%, transparent 100%);
      pointer-events: auto;
      cursor: ew-resize;
    }
    .wave-tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    .wave-val-pill {
      font-family: monospace;
      font-size: 11px;
      background: rgba(0,0,0,0.7);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
    }
    .wave-canvas {
      width: 100%;
      height: 90px;
      pointer-events: none;
    }

    /* 個別調整モード（🔓）時に現れる左右独立コマ送りボタン */
    .individual-ctrl-bar {
      position: absolute;
      bottom: 148px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      animation: fadeIn 0.2s ease;
    }
    .individual-ctrl-bar.active {
      display: flex;
    }
    .ind-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .ind-btn:hover { background: rgba(0,229,255,0.3); border-color: #00E5FF; }

    /* 中央下部に浮かぶ「極小スリガラス調ピルHUD」 */
    #floating-pill-hud {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 30, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #floating-pill-hud.hidden-ui {
      opacity: 0;
      transform: translate(-50%, 25px);
      pointer-events: none;
    }
    .pill-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s;
    }
    .pill-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .pill-btn.primary {
      background: #00E5FF;
      color: #000;
      font-weight: bold;
      border-color: #00E5FF;
      padding: 6px 16px;
    }
    .pill-btn.primary:hover { background: #6effff; }
    .pill-btn.lock-active {
      background: rgba(0, 230, 118, 0.2);
      border-color: #00E676;
      color: #00E676;
      font-weight: bold;
    }
    .pill-btn.unlock-active {
      background: rgba(255, 82, 82, 0.2);
      border-color: #FF5252;
      color: #FF5252;
      font-weight: bold;
    }

    /* フルスクリーン没入ヒント */
    #fullscreen-hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      z-index: 40;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .hidden-ui #fullscreen-hint {
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <!-- 1. 最上部 ミニマル情報ヘッダー -->
  <div id="top-bar">
    <div class="app-title">
      <span>⚡ MotionSync</span>
      <span style="color:#aaa; font-size:11px; font-weight:normal;">| 左右2画面 デュアル比較</span>
    </div>
    <div class="diff-badge" id="diff-badge">
      踏み込み差: +0.42G (今回が強力)
    </div>
    <div class="top-actions">
      <button class="top-btn" onclick="togglePlaySpeed()">速度: <span id="speed-label">0.25x</span></button>
      <button class="top-btn" onclick="toggleAllUI(event)">全画面没入</button>
      <button class="top-btn" onclick="resetSync()">同期リセット</button>
    </div>
  </div>

  <!-- 2. メイン 2画面スプリットビューポート -->
  <div id="viewport-container" onclick="onViewportClick(event)">

    <!-- ================= 左画面: 過去の大会 (動画A + 波形A) ================= -->
    <div class="screen-half left-screen" id="screenA">
      <div class="video-header-badge">
        <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#00E5FF;"></span>
        過去の大会 (動画 A)
      </div>
      <div class="video-time-badge" id="timeA">00:03.20</div>

      <!-- 背景の動画映像キャンバス -->
      <canvas id="canvas-video-a" class="video-canvas"></canvas>

      <!-- 映像の真上に浮かび上がる波形オーバーレイ (背景透明) -->
      <div class="wave-overlay-layer" id="overlayA" title="ドラッグして直接シーク可能">
        <div class="wave-tag-row">
          <span style="color:#00E5FF;">📊 過去大会 加速度波形 (±2s)</span>
          <span class="wave-val-pill" id="valA" style="color:#00E5FF;">1.85 G</span>
        </div>
        <canvas id="canvas-wave-a" class="wave-canvas"></canvas>
      </div>

      <!-- 個別調整モード時の単独コマ送りバー -->
      <div class="individual-ctrl-bar" id="ind-ctrl-a">
        <span style="font-size:10px; color:#00E5FF; font-weight:bold;">動画A頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('A', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('A', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- ================= 右画面: 今回の大会 (動画B + 波形B) ================= -->
    <div class="screen-half right-screen" id="screenB">
      <div class="video-header-badge b">
        <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#FF7043;"></span>
        今回の大会 (動画 B)
      </div>
      <div class="video-time-badge" id="timeB">00:03.12</div>

      <!-- 背景の動画映像キャンバス -->
      <canvas id="canvas-video-b" class="video-canvas"></canvas>

      <!-- 映像の真上に浮かび上がる波形オーバーレイ (背景透明) -->
      <div class="wave-overlay-layer" id="overlayB" title="ドラッグして直接シーク可能">
        <div class="wave-tag-row">
          <span style="color:#FF7043;">📊 今回大会 加速度波形 (±2s)</span>
          <span class="wave-val-pill" id="valB" style="color:#FF7043;">2.27 G</span>
        </div>
        <canvas id="canvas-wave-b" class="wave-canvas"></canvas>
      </div>

      <!-- 個別調整モード時の単独コマ送りバー -->
      <div class="individual-ctrl-bar" id="ind-ctrl-b">
        <span style="font-size:10px; color:#FF7043; font-weight:bold;">動画B頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('B', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('B', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- 3. 中央下部に浮かぶ「極小スリガラス調ピルHUD」 -->
    <div id="floating-pill-hud">
      <button class="pill-btn lock-active" id="sync-lock-btn" onclick="toggleSyncLock(event)" title="同期モード / 個別頭出しモードの切り替え">
        <span id="lock-icon">🔒</span> <span id="lock-text">同期ロック中</span>
      </button>

      <button class="pill-btn" onclick="stepDual(-33, event)" title="左右一緒に1コマ戻し">
        ◀ 1コマ
      </button>

      <button class="pill-btn primary" id="play-btn" onclick="togglePlay(event)">
        <span id="play-icon">❚❚</span> 一時停止
      </button>

      <button class="pill-btn" onclick="stepDual(33, event)" title="左右一緒に1コマ送り">
        1コマ ▶
      </button>

      <!-- 微調整ボタン -->
      <div style="display:flex; gap:2px; margin-left:4px; border-left:1px solid rgba(255,255,255,0.15); padding-left:8px;">
        <button class="pill-btn" style="padding:4px 8px; font-size:10px;" onclick="adjustOffset(-10, event)" title="Bを0.01秒早める">-0.01s</button>
        <button class="pill-btn" style="padding:4px 8px; font-size:10px;" onclick="adjustOffset(10, event)" title="Bを0.01秒遅らせる">+0.01s</button>
      </div>
    </div>

    <!-- 没入モード操作ヒント -->
    <div id="fullscreen-hint">画面タップ: UI表示/非表示切替 ｜ 左右ドラッグ: コマ送り</div>
  </div>

  <script>
    // --- 状態管理 ---
    let isPlaying = true;
    let isSyncLocked = true;     // true: 左右同期, false: 個別頭出し
    let playbackSpeed = 0.25;    // 0.1x, 0.25x, 0.5x, 1.0x
    let isUiVisible = true;

    let timeA = 3200;            // 動画Aの現在再生時刻 (ms)
    let baseOffsetMs = -80;      // 動画Bの初期同期ズレ (ms)
    let manualOffsetMs = 0;      // ユーザーによる微調整オフセット (ms)
    let totalMs = 12000;

    // キャンバス取得
    const cvA = document.getElementById('canvas-video-a');
    const ctxVA = cvA.getContext('2d');
    const cvB = document.getElementById('canvas-video-b');
    const ctxVB = cvB.getContext('2d');

    const cwA = document.getElementById('canvas-wave-a');
    const ctxWA = cwA.getContext('2d');
    const cwB = document.getElementById('canvas-wave-b');
    const ctxWB = cwB.getContext('2d');

    function resize() {
      cvA.width = cvA.parentElement.clientWidth;
      cvA.height = cvA.parentElement.clientHeight;
      cvB.width = cvB.parentElement.clientWidth;
      cvB.height = cvB.parentElement.clientHeight;

      cwA.width = cwA.parentElement.clientWidth;
      cwA.height = cwA.parentElement.clientHeight;
      cwB.width = cwB.parentElement.clientWidth;
      cwB.height = cwB.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', () => {
      resize();
      initDragSeek();
      renderFrame();
    });

    // --- UIトグル (ワンタップ全画面没入) ---
    function toggleAllUI(e) {
      if (e) e.stopPropagation();
      isUiVisible = !isUiVisible;
      document.getElementById('top-bar').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('floating-pill-hud').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('viewport-container').classList.toggle('hidden-ui', !isUiVisible);
    }

    function onViewportClick(e) {
      // ボタンや波形エリアをクリックした時は没入トグルを発動させない
      if (e.target.closest('#floating-pill-hud') || e.target.closest('.individual-ctrl-bar') || e.target.closest('.wave-overlay-layer') || e.target.closest('#top-bar')) {
        return;
      }
      toggleAllUI();
    }

    // --- 再生 / 一時停止 ---
    function togglePlay(e) {
      if (e) e.stopPropagation();
      isPlaying = !isPlaying;
      document.getElementById('play-icon').innerText = isPlaying ? '❚❚' : '▶';
      document.getElementById('play-btn').innerHTML = isPlaying ? '<span id="play-icon">❚❚</span> 一時停止' : '<span id="play-icon">▶</span> 再生';
    }

    // --- 左右同期コマ送り ---
    function stepDual(ms, e) {
      if (e) e.stopPropagation();
      if (isPlaying) togglePlay();
      timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      renderFrame();
    }

    // --- 個別単独コマ送り (頭出し用) ---
    function stepSingle(target, ms) {
      if (isPlaying) togglePlay();
      if (target === 'A') {
        timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      } else {
        manualOffsetMs += ms;
      }
      renderFrame();
    }

    // --- 同期ロック ⇄ 個別調整トグル ---
    function toggleSyncLock(e) {
      if (e) e.stopPropagation();
      isSyncLocked = !isSyncLocked;
      const btn = document.getElementById('sync-lock-btn');
      const icon = document.getElementById('lock-icon');
      const text = document.getElementById('lock-text');

      const indA = document.getElementById('ind-ctrl-a');
      const indB = document.getElementById('ind-ctrl-b');

      if (isSyncLocked) {
        btn.className = 'pill-btn lock-active';
        icon.innerText = '🔒';
        text.innerText = '同期ロック中';
        indA.classList.remove('active');
        indB.classList.remove('active');
      } else {
        btn.className = 'pill-btn unlock-active';
        icon.innerText = '🔓';
        text.innerText = '個別頭出し中';
        indA.classList.add('active');
        indB.classList.add('active');
      }
    }

    function adjustOffset(ms, e) {
      if (e) e.stopPropagation();
      manualOffsetMs += ms;
      renderFrame();
    }

    function resetSync() {
      manualOffsetMs = 0;
      timeA = 3200;
      renderFrame();
    }

    function togglePlaySpeed() {
      const speeds = [0.1, 0.25, 0.5, 1.0];
      const idx = speeds.indexOf(playbackSpeed);
      playbackSpeed = speeds[(idx + 1) % speeds.length];
      document.getElementById('speed-label').innerText = `${playbackSpeed}x`;
    }

    // --- 波形ダイレクトドラッグシーク ---
    function initDragSeek() {
      let isDragging = false;
      let startX = 0;

      const vp = document.getElementById('viewport-container');
      vp.addEventListener('mousedown', e => {
        if (e.target.closest('#floating-pill-hud') || e.target.closest('.individual-ctrl-bar') || e.target.closest('#top-bar')) return;
        isDragging = true;
        startX = e.clientX;
      });

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) {
          if (isPlaying) togglePlay();
          timeA = Math.max(0, Math.min(totalMs, timeA + (dx > 0 ? 33 : -33)));
          startX = e.clientX;
          renderFrame();
        }
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    // --- センサー波形計算 (加速度G) ---
    function getGA(tMs) {
      const t = tMs / 1000;
      const p = t * 3.4;
      const base = Math.sin(p);
      return 1.1 + (base > 0 ? Math.pow(base, 2) * 0.75 : base * 0.3 * 0.75);
    }
    function getGB(tMs) {
      const t = tMs / 1000;
      const p = t * 3.5;
      const base = Math.sin(p);
      return 1.1 + (base > 0 ? Math.pow(base, 2.3) * 1.17 : base * 0.25 * 1.17);
    }

    // --- 動画映像描画 (ランナー動作シミュレーション) ---
    function drawRunner(ctx, w, h, tMs, color, isSharp) {
      ctx.clearRect(0, 0, w, h);
      const t = tMs / 1000;
      const groundY = h * 0.78;

      // 走路グリッド
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, groundY); ctx.lineTo(w, groundY);
      ctx.stroke();

      for (let x = (t * 80) % 50; x < w; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, groundY); ctx.lineTo(x - 25, h);
        ctx.stroke();
      }

      // ランナー骨格
      const p = t * (isSharp ? 3.5 : 3.4);
      const bounce = Math.abs(Math.sin(p)) * (isSharp ? 18 : 13);
      const cx = w * 0.5;
      const cy = groundY - 50 - bounce;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';

      // 頭部
      ctx.beginPath();
      ctx.arc(cx, cy - 25, 9, 0, Math.PI * 2);
      ctx.fill();

      // 胴体 (前傾)
      const forwardLean = isSharp ? 7 : 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 16);
      ctx.lineTo(cx - forwardLean, cy + 18);
      ctx.stroke();

      // 腕 (スイング)
      const arm = Math.sin(p) * (isSharp ? 0.9 : 0.75);
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + Math.cos(arm) * 22, cy - 8 + Math.sin(arm) * 22);
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx - Math.cos(arm) * 22, cy - 8 - Math.sin(arm) * 22);
      ctx.stroke();

      // 脚 (キック・踏み込み)
      const leg1 = Math.cos(p) * (isSharp ? 1.0 : 0.85);
      const leg2 = -Math.cos(p) * (isSharp ? 1.0 : 0.85);

      // 脚1
      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k1x = cx - forwardLean + Math.sin(leg1) * 20;
      const k1y = cy + 18 + Math.cos(leg1) * 20;
      ctx.lineTo(k1x, k1y);
      ctx.lineTo(k1x + Math.sin(leg1 - 0.35) * 20, k1y + Math.cos(leg1 - 0.35) * 20);
      ctx.stroke();

      // 脚2
      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k2x = cx - forwardLean + Math.sin(leg2) * 20;
      const k2y = cy + 18 + Math.cos(leg2) * 20;
      ctx.lineTo(k2x, k2y);
      ctx.lineTo(k2x + Math.sin(leg2 - 0.35) * 20, k2y + Math.cos(leg2 - 0.35) * 20);
      ctx.stroke();

      // 接地インパクト円 (踏み込み瞬間エフェクト)
      if (bounce < 2.5) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.ellipse(k1x, groundY, isSharp ? 20 : 13, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // --- 映像上ダイレクト波形描画 (透明オーバーレイ) ---
    function drawDirectWaveOverlay(ctx, w, h, centerMs, color, gFunc) {
      ctx.clearRect(0, 0, w, h);

      // ゼロ基準線
      const midY = h * 0.65;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(0, midY); ctx.lineTo(w, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 波形ライン (発光調ネオン)
      const windowMs = 4000; // 前後±2.0秒 = 4000ms
      const pts = 70;
      ctx.strokeStyle = color;
      ctx.lineWidth = 3.0;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.beginPath();

      for (let i = 0; i <= pts; i++) {
        const frac = i / pts;
        const curMs = (centerMs - 2000) + (frac * windowMs);
        const g = gFunc(curMs);
        const x = frac * w;
        const y = Math.max(4, Math.min(h - 4, midY - ((g - 1.0) * (h * 0.55))));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0; // リセット

      // 中央 NOW マーカー (映像の上に浮かぶ垂直ライン)
      const cx = w / 2;
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 2.0;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();
      ctx.setLineDash([]);

      // NOW ドット
      ctx.fillStyle = '#EF4444';
      ctx.beginPath();
      ctx.arc(cx, midY - ((gFunc(centerMs) - 1.0) * (h * 0.55)), 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- タイムコード整形 ---
    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const f = Math.floor((ms % 1000) / 10);
      const min = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
    }

    // --- 全体フレーム描画 ---
    function renderFrame() {
      // 1. 各動画の再生位置計算
      const timeB = isSyncLocked ? Math.max(0, timeA + baseOffsetMs + manualOffsetMs) : Math.max(0, timeA + manualOffsetMs);

      // 2. 左画面 (動画A ＋ その上に直接波形A)
      drawRunner(ctxVA, cvA.width, cvA.height, timeA, '#00E5FF', false);
      drawDirectWaveOverlay(ctxWA, cwA.width, cwA.height, timeA, '#00E5FF', getGA);
      document.getElementById('timeA').innerText = formatTime(timeA);

      // 3. 右画面 (動画B ＋ その上に直接波形B)
      drawRunner(ctxVB, cvB.width, cvB.height, timeB, '#FF7043', true);
      drawDirectWaveOverlay(ctxWB, cwB.width, cwB.height, timeB, '#FF7043', getGB);
      document.getElementById('timeB').innerText = formatTime(timeB);

      // 4. センサー数値更新
      const ga = getGA(timeA);
      const gb = getGB(timeB);
      document.getElementById('valA').innerText = `${ga.toFixed(2)} G`;
      document.getElementById('valB').innerText = `${gb.toFixed(2)} G`;

      const diff = gb - ga;
      const sign = diff >= 0 ? '+' : '';
      const diffBadge = document.getElementById('diff-badge');
      diffBadge.innerText = `踏み込み差: ${sign}${diff.toFixed(2)}G (${diff >= 0 ? '今回大会が強力' : '過去大会が強力'})`;
    }

    // --- アニメーションループ ---
    let lastStamp = 0;
    function animLoop(stamp) {
      if (isPlaying) {
        if (!lastStamp) lastStamp = stamp;
        const delta = (stamp - lastStamp) * playbackSpeed;
        lastStamp = stamp;
        timeA += delta;
        if (timeA > totalMs) timeA = 0;
        renderFrame();
      } else {
        lastStamp = 0;
      }
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);
  </script>
</body>
</html>
