<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionSync Analytics - デュアル動画・波形統合分析</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 最上部 ミニマル情報ヘッダー */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 40;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #top-bar.hidden-ui {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .app-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diff-badge {
      background: rgba(255, 214, 0, 0.15);
      border: 1px solid rgba(255, 214, 0, 0.4);
      color: #FFD600;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      padding: 3px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .top-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }
    .top-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .top-btn.active { background: #00E5FF; color: #000; font-weight: bold; }
    .top-btn.rec-active { background: #FF5252; color: #fff; font-weight: bold; border-color: #FF5252; animation: pulse 1.5s infinite; }

    /* メイン 2画面スプリットビューポート */
    #viewport-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      background: #05070A;
    }

    .screen-half {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .screen-half.left-screen {
      border-right: 1px solid rgba(255,255,255,0.15);
    }

    /* 背景の動画映像キャンバス */
    .video-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* アノテーション手書きキャンバス (動画の手前レイヤー) */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none; /* 通常時は透過、ツール選択時にauto */
    }
    #draw-canvas.drawing-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* タップでファイル名を表示するバッジ */
    .file-badge {
      position: absolute;
      top: 50px;
      left: 14px;
      z-index: 25;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.6);
      color: #00E5FF;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: opacity 0.25s;
    }
    .file-badge.b {
      border-color: rgba(255, 112, 67, 0.7);
      color: #FF7043;
    }
    body.is-playing .file-badge {
      opacity: 0;
      pointer-events: none;
    }

    .video-time-badge {
      position: absolute;
      top: 50px;
      right: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity 0.3s;
    }
    body.is-playing .video-time-badge {
      opacity: 0.35;
    }

    /* 映像の上に直接透過オーバーレイする波形レイヤー */
    .wave-overlay-layer {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      height: 125px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 6px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.12) 75%, transparent 100%);
      pointer-events: auto;
      cursor: ew-resize;
    }
    .wave-tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    .wave-legend-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .wave-canvas {
      width: 100%;
      height: 90px;
      pointer-events: none;
    }

    /* 各動画専用の独立シークバー */
    .video-seekbar-panel {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      height: 28px;
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 25;
      transition: opacity 0.3s, transform 0.3s;
    }
    .video-seekbar-panel.hidden-ui {
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
    }
    .seek-slider {
      flex: 1;
      height: 4px;
      accent-color: #00E5FF;
      cursor: pointer;
    }
    .seek-slider.b {
      accent-color: #FF7043;
    }

    /* 個別調整モード（🔓）時の専用コマ送りバー */
    .individual-ctrl-bar {
      position: absolute;
      bottom: 170px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      animation: fadeIn 0.2s ease;
    }
    .individual-ctrl-bar.active {
      display: flex;
    }
    .ind-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .ind-btn:hover { background: rgba(0,229,255,0.3); border-color: #00E5FF; }

    /* 中央下部に浮かぶ「極小スリガラス調ピルHUD」 */
    #floating-pill-hud {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 30, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #floating-pill-hud.hidden-ui {
      opacity: 0;
      transform: translate(-50%, 25px);
      pointer-events: none;
    }
    .pill-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 5px 11px;
      font-size: 11px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s;
    }
    .pill-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .pill-btn.primary {
      background: #00E5FF;
      color: #000;
      font-weight: bold;
      border-color: #00E5FF;
      padding: 5px 14px;
    }
    .pill-btn.lock-active {
      background: rgba(0, 230, 118, 0.2);
      border-color: #00E676;
      color: #00E676;
      font-weight: bold;
    }
    .pill-btn.unlock-active {
      background: rgba(255, 82, 82, 0.2);
      border-color: #FF5252;
      color: #FF5252;
      font-weight: bold;
    }

    /* ✏️ アノテーション描画ツールバー (画面左側にフローティング) */
    #draw-toolbar {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      background: rgba(18, 24, 34, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 55;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      transition: opacity 0.3s, transform 0.3s;
    }
    #draw-toolbar.hidden-ui {
      opacity: 0;
      transform: translateY(-50%) translateX(-25px);
      pointer-events: none;
    }
    .tool-icon-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 52px;
      transition: 0.15s;
    }
    .tool-icon-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .tool-icon-btn.active { background: #FFD600; color: #000; font-weight: bold; border-color: #FFD600; }

    /* 設定ドロワー / パネル */
    #settings-drawer {
      position: absolute;
      top: 48px;
      right: 16px;
      width: 360px;
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(18, 24, 34, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 10px;
      padding: 14px;
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      animation: fadeIn 0.2s ease;
    }
    #settings-drawer.active {
      display: flex;
    }
    .drawer-title {
      font-size: 12px;
      font-weight: bold;
      color: #00E5FF;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }
    .section-label {
      font-size: 11px;
      color: #bbb;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .wave-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 3px;
    }
    .wave-check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      flex: 1;
    }
    .color-picker-trigger {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      position: relative;
    }
    .color-palette-pop {
      position: absolute;
      top: 22px;
      right: 0;
      background: #1A202C;
      border: 1px solid #4A5568;
      border-radius: 6px;
      padding: 6px;
      display: none;
      gap: 5px;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .color-palette-pop.show {
      display: flex;
    }
    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      cursor: pointer;
    }
    .swatch:hover { transform: scale(1.2); }

    .speed-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }
    .speed-slider {
      flex: 1;
      height: 4px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <!-- 1. 最上部 ミニマル情報ヘッダー -->
  <div id="top-bar">
    <div class="app-title">
      <span>⚡ MotionSync</span>
      <span style="color:#aaa; font-size:11px; font-weight:normal;">| 左右2画面 デュアル分析</span>
    </div>
    <div class="diff-badge" id="diff-badge">
      踏み込み差: +0.42G (動画Bが強力)
    </div>
    <div class="top-actions">
      <button class="top-btn" id="rec-btn" onclick="toggleRecording(event)">🎥 指導動画録画</button>
      <button class="top-btn" id="settings-btn" onclick="toggleSettingsDrawer(event)">⚙ 波形・カラー・速度</button>
      <button class="top-btn" onclick="toggleAllUI(event)">全画面没入</button>
      <button class="top-btn" onclick="resetSync()">同期リセット</button>
    </div>
  </div>

  <!-- ✏️ アノテーション描画ツールバー (左側フローティング) -->
  <div id="draw-toolbar" onclick="event.stopPropagation()">
    <button class="tool-icon-btn active" id="btn-tool-none" onclick="setDrawTool('none')">
      <span>👆</span><span>通常</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-pen" onclick="setDrawTool('pen')">
      <span>✏️</span><span>手書き</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-arrow" onclick="setDrawTool('arrow')">
      <span>↗️</span><span>矢印線</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-circle" onclick="setDrawTool('circle')">
      <span>⭕</span><span>円マーク</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-angle" onclick="setDrawTool('angle')">
      <span>📐</span><span>3点角度</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-text" onclick="setDrawTool('text')">
      <span>💬</span><span>文字入力</span>
    </button>
    <button class="tool-icon-btn" id="btn-tool-track" onclick="toggleAutoTrack()">
      <span>🎯</span><span id="track-label">追尾:OFF</span>
    </button>
    <button class="tool-icon-btn" style="color:#FF5252;" onclick="clearDrawings()">
      <span>🗑</span><span>クリア</span>
    </button>
  </div>

  <!-- 設定ドロワー (全波形網羅・カラー変更・独立速度) -->
  <div id="settings-drawer" onclick="event.stopPropagation()">
    <div class="drawer-title">
      <span>⚙️ 波形全項目 ＆ 設定パレット</span>
      <span style="cursor:pointer; color:#FF5252;" onclick="toggleSettingsDrawer(event)">✕ 閉じる</span>
    </div>

    <!-- 1. 表示波形の選択 (全網羅) ＆ 項目別カラー変更 -->
    <div>
      <div class="section-label">
        <span>波形項目全リスト (全13系列):</span>
        <span style="font-size:9px; color:#aaa;">色丸タップで変更</span>
      </div>
      <div id="wave-items-list">
        <!-- JS動的生成 -->
      </div>
    </div>

    <!-- 2. 動画ごとの再生速度スライダー (0.1x〜2.0x 倍速対応) -->
    <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
      <div class="section-label">
        <span>動画A 速度: <span id="speed-label-a" style="color:#00E5FF; font-weight:bold;">0.25x</span></span>
      </div>
      <div class="speed-slider-row">
        <span>0.1x</span>
        <input type="range" class="speed-slider" id="speed-slider-a" min="0.1" max="2.0" step="0.05" value="0.25" oninput="setSpeed('A', this.value)" style="accent-color:#00E5FF;">
        <span>2.0x</span>
      </div>
    </div>
    <div>
      <div class="section-label">
        <span>動画B 速度: <span id="speed-label-b" style="color:#FF7043; font-weight:bold;">0.25x</span></span>
      </div>
      <div class="speed-slider-row">
        <span>0.1x</span>
        <input type="range" class="speed-slider" id="speed-slider-b" min="0.1" max="2.0" step="0.05" value="0.25" oninput="setSpeed('B', this.value)" style="accent-color:#FF7043;">
        <span>2.0x</span>
      </div>
    </div>
  </div>

  <!-- 2. メイン 2画面スプリットビューポート -->
  <div id="viewport-container" onclick="onViewportClick(event)">

    <!-- アノテーション描画キャンバス (全画面にオーバーレイ) -->
    <canvas id="draw-canvas"></canvas>

    <!-- ================= 左画面: 動画 A ================= -->
    <div class="screen-half left-screen" id="screenA">
      <!-- タップでファイル名を表示 (再生時は自動非表示) -->
      <div class="file-badge" id="fileBadgeA" onclick="toggleFileName('A', event)">
        <span id="fileNameA">📁 20261015_秋季大会_走幅跳_決勝.mp4</span>
      </div>
      <div class="video-time-badge" id="timeA">00:03.20</div>

      <canvas id="canvas-video-a" class="video-canvas"></canvas>

      <!-- 映像の真上に浮かび上がる波形オーバーレイ -->
      <div class="wave-overlay-layer" id="overlayA" title="ドラッグして直接シーク可能">
        <div class="wave-tag-row">
          <div class="wave-legend-group" id="legendA"></div>
          <span class="wave-val-pill" id="valA">1.85 G</span>
        </div>
        <canvas id="canvas-wave-a" class="wave-canvas"></canvas>
      </div>

      <!-- 動画A専用シークバー -->
      <div class="video-seekbar-panel" id="seekbar-panel-a" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#00E5FF; font-weight:bold;">A</span>
        <input type="range" id="seekA" class="seek-slider" min="0" max="10000" value="3200" oninput="onSeekSingle('A', this.value)">
      </div>

      <!-- 個別調整モード時の単独コマ送りバー -->
      <div class="individual-ctrl-bar" id="ind-ctrl-a" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#00E5FF; font-weight:bold;">動画A頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('A', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('A', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- ================= 右画面: 動画 B ================= -->
    <div class="screen-half right-screen" id="screenB">
      <!-- タップでファイル名を表示 (再生時は自動非表示) -->
      <div class="file-badge b" id="fileBadgeB" onclick="toggleFileName('B', event)">
        <span id="fileNameB">📁 20261102_県選手権_走幅跳_3回目.mp4</span>
      </div>
      <div class="video-time-badge" id="timeB">00:03.12</div>

      <canvas id="canvas-video-b" class="video-canvas"></canvas>

      <!-- 映像の真上に浮かび上がる波形オーバーレイ -->
      <div class="wave-overlay-layer" id="overlayB" title="ドラッグして直接シーク可能">
        <div class="wave-tag-row">
          <div class="wave-legend-group" id="legendB"></div>
          <span class="wave-val-pill" id="valB">2.27 G</span>
        </div>
        <canvas id="canvas-wave-b" class="wave-canvas"></canvas>
      </div>

      <!-- 動画B専用シークバー -->
      <div class="video-seekbar-panel" id="seekbar-panel-b" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#FF7043; font-weight:bold;">B</span>
        <input type="range" id="seekB" class="seek-slider b" min="0" max="10000" value="3120" oninput="onSeekSingle('B', this.value)">
      </div>

      <!-- 個別調整モード時の単独コマ送りバー -->
      <div class="individual-ctrl-bar" id="ind-ctrl-b" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#FF7043; font-weight:bold;">動画B頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('B', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('B', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- 3. 中央下部に浮かぶ「極小スリガラス調ピルHUD」 -->
    <div id="floating-pill-hud">
      <button class="pill-btn lock-active" id="sync-lock-btn" onclick="toggleSyncLock(event)" title="同期モード / 個別頭出しモードの切り替え">
        <span id="lock-icon">🔒</span> <span id="lock-text">同期中</span>
      </button>

      <button class="pill-btn" onclick="stepDual(-33, event)" title="左右一緒に1コマ戻し">
        ◀ 1コマ
      </button>

      <button class="pill-btn primary" id="play-btn" onclick="togglePlay(event)">
        <span id="play-icon">❚❚</span> 一時停止
      </button>

      <button class="pill-btn" onclick="stepDual(33, event)" title="左右一緒に1コマ送り">
        1コマ ▶
      </button>

      <div style="display:flex; gap:2px; margin-left:2px; border-left:1px solid rgba(255,255,255,0.15); padding-left:6px;">
        <button class="pill-btn" style="padding:4px 7px; font-size:10px;" onclick="adjustOffset(-10, event)" title="Bを0.01秒早める">-0.01s</button>
        <button class="pill-btn" style="padding:4px 7px; font-size:10px;" onclick="adjustOffset(10, event)" title="Bを0.01秒遅らせる">+0.01s</button>
      </div>
    </div>
  </div>

  <script>
    // --- 状態管理 ---
    let isPlaying = true;
    let isSyncLocked = true;
    let isUiVisible = true;
    let isRecording = false;
    let isAutoTracking = false;

    let timeA = 3200;
    let timeB = 3120;
    let syncOffsetMs = timeB - timeA;
    let totalMs = 10000;

    let speedA = 0.25;
    let speedB = 0.25;

    // 描画ツール: 'none', 'pen', 'arrow', 'circle', 'angle', 'text'
    let currentTool = 'none';
    let drawColor = '#FFD600';
    let annotations = []; // { type, points, text, angle, color }
    let tempPoints = [];

    const PRESET_COLORS = [
      '#FFD740', '#FF5252', '#00E5FF', '#69F0AE',
      '#FF4081', '#7C4DFF', '#FF9100', '#FFFFFF'
    ];

    // 全波形系列定義 (仕様書完全網羅)
    const WAVE_SERIES = [
      { id: 'accTotal', label: 'Acc 合成G (合算)', color: '#FFD740', selected: true },
      { id: 'accX',     label: 'Acc X軸 (前後)',   color: '#FF5252', selected: true },
      { id: 'accY',     label: 'Acc Y軸 (左右)',   color: '#69F0AE', selected: false },
      { id: 'accZ',     label: 'Acc Z軸 (垂直)',   color: '#40C4FF', selected: false },
      { id: 'gyrTotal', label: 'Gyro 合成 (合算)', color: '#FF4081', selected: false },
      { id: 'gyrX',     label: 'Gyro X軸 (ロール)', color: '#FF9100', selected: false },
      { id: 'gyrY',     label: 'Gyro Y軸 (ピッチ)', color: '#00E676', selected: false },
      { id: 'gyrZ',     label: 'Gyro Z軸 (ヨー)',   color: '#7C4DFF', selected: false },
      { id: 'angTotal', label: 'Angle 合成 (傾斜)', color: '#FFFFFF', selected: false },
      { id: 'roll',     label: 'Roll 傾斜角',     color: '#E040FB', selected: false },
      { id: 'pitch',    label: 'Pitch 傾斜角',    color: '#18FFFF', selected: false },
      { id: 'yaw',      label: 'Yaw 方位角',      color: '#EEFF41', selected: false },
    ];

    // キャンバス取得
    const cvA = document.getElementById('canvas-video-a');
    const ctxVA = cvA.getContext('2d');
    const cvB = document.getElementById('canvas-video-b');
    const ctxVB = cvB.getContext('2d');

    const cwA = document.getElementById('canvas-wave-a');
    const ctxWA = cwA.getContext('2d');
    const cwB = document.getElementById('canvas-wave-b');
    const ctxWB = cwB.getContext('2d');

    const cd = document.getElementById('draw-canvas');
    const ctxD = cd.getContext('2d');

    function resize() {
      cvA.width = cvA.parentElement.clientWidth;
      cvA.height = cvA.parentElement.clientHeight;
      cvB.width = cvB.parentElement.clientWidth;
      cvB.height = cvB.parentElement.clientHeight;

      cwA.width = cwA.parentElement.clientWidth;
      cwA.height = cwA.parentElement.clientHeight;
      cwB.width = cwB.parentElement.clientWidth;
      cwB.height = cwB.parentElement.clientHeight;

      cd.width = cd.parentElement.clientWidth;
      cd.height = cd.parentElement.clientHeight;

      renderAnnotations();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', () => {
      initWaveSettingsList();
      resize();
      initDragSeek();
      initCanvasDrawEvents();
      renderFrame();
    });

    // --- アノテーション描画ツール選択 ---
    function setDrawTool(tool) {
      currentTool = tool;
      tempPoints = [];
      document.querySelectorAll('.tool-icon-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-tool-${tool}`);
      if (activeBtn) activeBtn.classList.add('active');

      cd.classList.toggle('drawing-active', tool !== 'none');
    }

    function clearDrawings() {
      annotations = [];
      tempPoints = [];
      renderAnnotations();
    }

    function toggleAutoTrack() {
      isAutoTracking = !isAutoTracking;
      document.getElementById('track-label').innerText = isAutoTracking ? '追尾:ON' : '追尾:OFF';
      document.getElementById('btn-tool-track').classList.toggle('active', isAutoTracking);
      renderAnnotations();
    }

    // --- 描画イベントリスナー ---
    function initCanvasDrawEvents() {
      let isDrawing = false;

      cd.addEventListener('mousedown', e => {
        if (currentTool === 'none') return;
        const rect = cd.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

        if (currentTool === 'angle') {
          tempPoints.push(pt);
          if (tempPoints.length === 3) {
            const angle = calcAngle(tempPoints[0], tempPoints[1], tempPoints[2]);
            annotations.push({ type: 'angle', points: [...tempPoints], angle, color: drawColor });
            tempPoints = [];
          }
          renderAnnotations();
          return;
        }

        if (currentTool === 'text') {
          const text = prompt('選手への指導コメント・指示を入力してください:', 'ここで前傾姿勢キープ！');
          if (text) {
            annotations.push({ type: 'text', points: [pt], text, color: '#FFD600' });
            renderAnnotations();
          }
          return;
        }

        isDrawing = true;
        tempPoints = [pt];
      });

      cd.addEventListener('mousemove', e => {
        if (!isDrawing) return;
        const rect = cd.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

        if (currentTool === 'pen') {
          tempPoints.push(pt);
        } else {
          tempPoints[1] = pt; // 直線や円の終点
        }
        renderAnnotations();
      });

      window.addEventListener('mouseup', () => {
        if (isDrawing && tempPoints.length > 1) {
          annotations.push({ type: currentTool, points: [...tempPoints], color: drawColor });
          tempPoints = [];
        }
        isDrawing = false;
        renderAnnotations();
      });
    }

    function calcAngle(pA, pB, pC) {
      const v1x = pA.x - pB.x, v1y = pA.y - pB.y;
      const v2x = pC.x - pB.x, v2y = pC.y - pB.y;
      const dot = v1x * v2x + v1y * v2y;
      const len1 = Math.sqrt(v1x * v1x + v1y * v1y);
      const len2 = Math.sqrt(v2x * v2x + v2y * v2y);
      if (len1 === 0 || len2 === 0) return '0.0';
      const cosT = Math.max(-1, Math.min(1, dot / (len1 * len2)));
      return (Math.acos(cosT) * (180 / Math.PI)).toFixed(1);
    }

    function renderAnnotations() {
      ctxD.clearRect(0, 0, cd.width, cd.height);

      // 1. 確定したオブジェクト描画
      const allObjs = [...annotations];
      if (tempPoints.length > 0) {
        allObjs.push({ type: currentTool, points: tempPoints, color: drawColor });
      }

      allObjs.forEach(obj => {
        ctxD.strokeStyle = obj.color;
        ctxD.fillStyle = obj.color;
        ctxD.lineWidth = 3;
        ctxD.lineCap = 'round';

        if (obj.type === 'pen' && obj.points.length > 1) {
          ctxD.beginPath();
          obj.points.forEach((p, idx) => {
            if (idx === 0) ctxD.moveTo(p.x, p.y);
            else ctxD.lineTo(p.x, p.y);
          });
          ctxD.stroke();
        } else if (obj.type === 'arrow' && obj.points.length >= 2) {
          const p1 = obj.points[0], p2 = obj.points[1];
          ctxD.beginPath(); ctxD.moveTo(p1.x, p1.y); ctxD.lineTo(p2.x, p2.y); ctxD.stroke();
          const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
          ctxD.beginPath();
          ctxD.moveTo(p2.x, p2.y);
          ctxD.lineTo(p2.x - 14 * Math.cos(ang - 0.4), p2.y - 14 * Math.sin(ang - 0.4));
          ctxD.lineTo(p2.x - 14 * Math.cos(ang + 0.4), p2.y - 14 * Math.sin(ang + 0.4));
          ctxD.fill();
        } else if (obj.type === 'circle' && obj.points.length >= 2) {
          const p1 = obj.points[0], p2 = obj.points[1];
          const rx = Math.abs(p2.x - p1.x);
          const ry = Math.abs(p2.y - p1.y);
          ctxD.beginPath();
          ctxD.ellipse(p1.x, p1.y, rx, ry, 0, 0, Math.PI * 2);
          ctxD.stroke();
        } else if (obj.type === 'angle') {
          ctxD.beginPath();
          obj.points.forEach((p, idx) => {
            ctxD.arc(p.x, p.y, 5, 0, Math.PI * 2);
            if (idx > 0) {
              ctxD.moveTo(obj.points[idx-1].x, obj.points[idx-1].y);
              ctxD.lineTo(p.x, p.y);
            }
          });
          ctxD.stroke();
          if (obj.angle && obj.points.length === 3) {
            const b = obj.points[1];
            ctxD.fillStyle = '#FFD600';
            ctxD.fillRect(b.x + 10, b.y - 26, 65, 22);
            ctxD.fillStyle = '#000';
            ctxD.font = 'bold 12px sans-serif';
            ctxD.fillText(`${obj.angle}°`, b.x + 16, b.y - 10);
          }
        } else if (obj.type === 'text') {
          const p = obj.points[0];
          ctxD.font = 'bold 13px sans-serif';
          const textW = ctxD.measureText(obj.text).width;
          ctxD.fillStyle = 'rgba(0,0,0,0.85)';
          ctxD.fillRect(p.x - 4, p.y - 20, textW + 16, 26);
          ctxD.strokeStyle = '#00E5FF';
          ctxD.strokeRect(p.x - 4, p.y - 20, textW + 16, 26);
          ctxD.fillStyle = '#00E5FF';
          ctxD.fillText(obj.text, p.x + 4, p.y - 3);
        }
      });

      // 2. AI自動追尾シミュレーション (ランナーの接地足・頭部に追従)
      if (isAutoTracking) {
        const halfW = cd.width / 2;
        // 左ランナー足先追尾
        drawAutoTracker(ctxD, halfW * 0.5, cd.height * 0.78, '#00E5FF', '足先 接地点');
        // 右ランナー足先追尾
        drawAutoTracker(ctxD, halfW + (halfW * 0.5), cd.height * 0.78, '#FF7043', '足先 接地点');
      }
    }

    function drawAutoTracker(ctx, cx, cy, color, label) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(cx - 30, cy + 26, 60, 16);
      ctx.fillStyle = color;
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText(label, cx - 24, cy + 38);
    }

    // --- 🎥 フィードバック動画録画・書き出し ---
    function toggleRecording(e) {
      if (e) e.stopPropagation();
      isRecording = !isRecording;
      const btn = document.getElementById('rec-btn');
      if (isRecording) {
        btn.classList.add('rec-active');
        btn.innerHTML = '🔴 録画中... (タップで保存)';
      } else {
        btn.classList.remove('rec-active');
        btn.innerHTML = '🎥 指導動画録画';
        alert('【選手フィードバック動画エクスポート完了】\n\n' +
              '・左右比較動画\n' +
              '・センサー加速度波形オーバーレイ\n' +
              '・関節角度計測（📐）\n' +
              '・指導コメントテキスト（💬）\n\n' +
              'を重畳統合した高画質MP4動画（Feedback_Analysis_Export.mp4）を書き出しました！\n' +
              '選手へLINEやAirDropで即座に共有可能です。');
      }
    }

    // --- 波形設定リストの動的生成 ---
    function initWaveSettingsList() {
      const container = document.getElementById('wave-items-list');
      container.innerHTML = '';

      WAVE_SERIES.forEach((s) => {
        const row = document.createElement('div');
        row.className = `wave-item-row`;

        const labelBox = document.createElement('div');
        labelBox.className = 'wave-check-label';
        labelBox.innerHTML = `
          <input type="checkbox" ${s.selected ? 'checked' : ''} style="accent-color:${s.color}; cursor:pointer;">
          <span>${s.label}</span>
        `;
        labelBox.onclick = () => {
          s.selected = !s.selected;
          labelBox.querySelector('input').checked = s.selected;
          updateLegends();
          renderFrame();
        };

        const colorBox = document.createElement('div');
        colorBox.style.position = 'relative';

        const trigger = document.createElement('div');
        trigger.className = 'color-picker-trigger';
        trigger.style.backgroundColor = s.color;
        trigger.title = 'カラーを変更';

        const pop = document.createElement('div');
        pop.className = 'color-palette-pop';
        PRESET_COLORS.forEach(c => {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.style.backgroundColor = c;
          swatch.onclick = (e) => {
            e.stopPropagation();
            s.color = c;
            trigger.style.backgroundColor = c;
            labelBox.querySelector('input').style.accentColor = c;
            pop.classList.remove('show');
            updateLegends();
            renderFrame();
          };
          pop.appendChild(swatch);
        });

        trigger.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll('.color-palette-pop').forEach(p => { if (p !== pop) p.classList.remove('show'); });
          pop.classList.toggle('show');
        };

        colorBox.appendChild(trigger);
        colorBox.appendChild(pop);
        row.appendChild(labelBox);
        row.appendChild(colorBox);
        container.appendChild(row);
      });

      updateLegends();
    }

    function updateLegends() {
      const legA = document.getElementById('legendA');
      const legB = document.getElementById('legendB');
      legA.innerHTML = '';
      legB.innerHTML = '';

      const active = WAVE_SERIES.filter(s => s.selected);
      if (active.length === 0) {
        legA.innerHTML = '<span style="color:#888;">(波形非表示)</span>';
        legB.innerHTML = '<span style="color:#888;">(波形非表示)</span>';
        return;
      }

      active.forEach(s => {
        const itemA = document.createElement('div');
        itemA.className = 'legend-item';
        itemA.innerHTML = `<span class="legend-dot" style="background:${s.color};"></span><span>${s.label}</span>`;
        legA.appendChild(itemA);

        const itemB = document.createElement('div');
        itemB.className = 'legend-item';
        itemB.innerHTML = `<span class="legend-dot" style="background:${s.color};"></span><span>${s.label}</span>`;
        legB.appendChild(itemB);
      });
    }

    function toggleSettingsDrawer(e) {
      if (e) e.stopPropagation();
      const drawer = document.getElementById('settings-drawer');
      const btn = document.getElementById('settings-btn');
      drawer.classList.toggle('active');
      btn.classList.toggle('active');
    }

    function setSpeed(target, val) {
      const num = parseFloat(val);
      if (target === 'A') {
        speedA = num;
        document.getElementById('speed-label-a').innerText = `${num.toFixed(2)}x`;
      } else {
        speedB = num;
        document.getElementById('speed-label-b').innerText = `${num.toFixed(2)}x`;
      }
    }

    function toggleFileName(target, e) {
      if (e) e.stopPropagation();
      const name = target === 'A' ? '20261015_秋季大会_走幅跳_決勝.mp4' : '20261102_県選手権_走幅跳_3回目.mp4';
      alert(`ファイル名 [動画${target}]:\n${name}`);
    }

    function toggleAllUI(e) {
      if (e) e.stopPropagation();
      isUiVisible = !isUiVisible;
      document.getElementById('top-bar').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('floating-pill-hud').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('draw-toolbar').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('seekbar-panel-a').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('seekbar-panel-b').classList.toggle('hidden-ui', !isUiVisible);
      document.getElementById('settings-drawer').classList.remove('active');
      document.getElementById('settings-btn').classList.remove('active');
    }

    function onViewportClick(e) {
      if (e.target.closest('#floating-pill-hud') || e.target.closest('.individual-ctrl-bar') ||
          e.target.closest('.video-seekbar-panel') || e.target.closest('#top-bar') ||
          e.target.closest('#settings-drawer') || e.target.closest('#draw-toolbar') ||
          e.target.closest('.file-badge') || currentTool !== 'none') {
        return;
      }
      toggleAllUI();
    }

    function togglePlay(e) {
      if (e) e.stopPropagation();
      isPlaying = !isPlaying;
      document.body.classList.toggle('is-playing', isPlaying);
      document.getElementById('play-icon').innerText = isPlaying ? '❚❚' : '▶';
      document.getElementById('play-btn').innerHTML = isPlaying ? '<span id="play-icon">❚❚</span> 一時停止' : '<span id="play-icon">▶</span> 再生';
    }

    function toggleSyncLock(e) {
      if (e) e.stopPropagation();
      isSyncLocked = !isSyncLocked;
      const btn = document.getElementById('sync-lock-btn');
      const icon = document.getElementById('lock-icon');
      const text = document.getElementById('lock-text');

      const indA = document.getElementById('ind-ctrl-a');
      const indB = document.getElementById('ind-ctrl-b');

      if (isSyncLocked) {
        syncOffsetMs = timeB - timeA;
        btn.className = 'pill-btn lock-active';
        icon.innerText = '🔒';
        text.innerText = '同期中';
        indA.classList.remove('active');
        indB.classList.remove('active');
      } else {
        btn.className = 'pill-btn unlock-active';
        icon.innerText = '🔓';
        text.innerText = '個別頭出し中';
        indA.classList.add('active');
        indB.classList.add('active');
      }
    }

    function stepDual(ms, e) {
      if (e) e.stopPropagation();
      if (isPlaying) togglePlay();
      timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      renderFrame();
    }

    function stepSingle(target, ms) {
      if (isPlaying) togglePlay();
      if (target === 'A') {
        timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      } else {
        timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      }
      renderFrame();
    }

    function onSeekSingle(target, val) {
      const ms = parseInt(val);
      if (target === 'A') {
        timeA = ms;
        if (isSyncLocked) timeB = Math.max(0, Math.min(totalMs, timeA + syncOffsetMs));
      } else {
        timeB = ms;
        if (isSyncLocked) timeA = Math.max(0, Math.min(totalMs, timeB - syncOffsetMs));
      }
      renderFrame();
    }

    function adjustOffset(ms, e) {
      if (e) e.stopPropagation();
      timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      syncOffsetMs = timeB - timeA;
      renderFrame();
    }

    function resetSync() {
      timeA = 3200;
      timeB = 3200;
      syncOffsetMs = 0;
      renderFrame();
    }

    function initDragSeek() {
      let isDragging = false;
      let startX = 0;

      const vp = document.getElementById('viewport-container');
      vp.addEventListener('mousedown', e => {
        if (currentTool !== 'none' || e.target.closest('#floating-pill-hud') || e.target.closest('.individual-ctrl-bar') ||
            e.target.closest('.video-seekbar-panel') || e.target.closest('#top-bar') ||
            e.target.closest('#settings-drawer') || e.target.closest('#draw-toolbar')) return;
        isDragging = true;
        startX = e.clientX;
      });

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) {
          if (isPlaying) togglePlay();
          const dt = dx > 0 ? 33 : -33;
          timeA = Math.max(0, Math.min(totalMs, timeA + dt));
          timeB = Math.max(0, Math.min(totalMs, timeB + dt));
          startX = e.clientX;
          renderFrame();
        }
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    function calcSensorMetrics(tMs, isB) {
      const t = tMs / 1000;
      const factor = isB ? 1.05 : 1.0;
      const p = t * (isB ? 3.5 : 3.4);
      const base = Math.sin(p);

      const ax = Math.sin(p) * 1.5 * factor;
      const ay = Math.cos(p) * 0.9 * factor;
      const az = 1.0 + (base > 0 ? Math.pow(base, isB ? 2.3 : 2.0) * (isB ? 1.4 : 1.0) : base * 0.3);
      const totalG = Math.sqrt(ax * ax + ay * ay + az * az);

      const gx = Math.cos(p) * 280 * factor;
      const gy = Math.sin(p * 1.2) * 200 * factor;
      const gz = Math.cos(p * 0.8) * 150 * factor;
      const totalGyr = Math.sqrt(gx * gx + gy * gy + gz * gz);

      const roll = Math.sin(t) * 35;
      const pitch = Math.cos(t * 1.2) * 25;
      const yaw = ((t * 40) % 360) - 180;
      const totalAng = Math.sqrt(roll * roll + pitch * pitch);

      return { ax, ay, az, totalG, gx, gy, gz, totalGyr, roll, pitch, yaw, totalAng };
    }

    function drawRunner(ctx, w, h, tMs, color, isSharp) {
      ctx.clearRect(0, 0, w, h);
      const t = tMs / 1000;
      const groundY = h * 0.78;

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, groundY); ctx.lineTo(w, groundY);
      ctx.stroke();

      for (let x = (t * 80) % 50; x < w; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, groundY); ctx.lineTo(x - 25, h);
        ctx.stroke();
      }

      const p = t * (isSharp ? 3.5 : 3.4);
      const bounce = Math.abs(Math.sin(p)) * (isSharp ? 18 : 13);
      const cx = w * 0.5;
      const cy = groundY - 50 - bounce;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(cx, cy - 25, 9, 0, Math.PI * 2);
      ctx.fill();

      const forwardLean = isSharp ? 7 : 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 16);
      ctx.lineTo(cx - forwardLean, cy + 18);
      ctx.stroke();

      const arm = Math.sin(p) * (isSharp ? 0.9 : 0.75);
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + Math.cos(arm) * 22, cy - 8 + Math.sin(arm) * 22);
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx - Math.cos(arm) * 22, cy - 8 - Math.sin(arm) * 22);
      ctx.stroke();

      const leg1 = Math.cos(p) * (isSharp ? 1.0 : 0.85);
      const leg2 = -Math.cos(p) * (isSharp ? 1.0 : 0.85);

      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k1x = cx - forwardLean + Math.sin(leg1) * 20;
      const k1y = cy + 18 + Math.cos(leg1) * 20;
      ctx.lineTo(k1x, k1y);
      ctx.lineTo(k1x + Math.sin(leg1 - 0.35) * 20, k1y + Math.cos(leg1 - 0.35) * 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k2x = cx - forwardLean + Math.sin(leg2) * 20;
      const k2y = cy + 18 + Math.cos(leg2) * 20;
      ctx.lineTo(k2x, k2y);
      ctx.lineTo(k2x + Math.sin(leg2 - 0.35) * 20, k2y + Math.cos(leg2 - 0.35) * 20);
      ctx.stroke();

      if (bounce < 2.5) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.ellipse(k1x, groundY, isSharp ? 20 : 13, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawDirectWaveOverlay(ctx, w, h, centerMs, isB) {
      ctx.clearRect(0, 0, w, h);

      const midY = h * 0.65;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(0, midY); ctx.lineTo(w, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      const windowMs = 4000;
      const pts = 65;

      const activeSeries = WAVE_SERIES.filter(s => s.selected);
      if (activeSeries.length === 0) return;

      activeSeries.forEach(series => {
        ctx.strokeStyle = series.color;
        ctx.lineWidth = series.id.includes('Total') ? 2.8 : 1.6;
        ctx.shadowColor = series.color;
        ctx.shadowBlur = series.id.includes('Total') ? 6 : 0;
        ctx.beginPath();

        for (let i = 0; i <= pts; i++) {
          const frac = i / pts;
          const curMs = (centerMs - 2000) + (frac * windowMs);
          const m = calcSensorMetrics(curMs, isB);

          let val = 0;
          let scale = h * 0.5;
          if (series.id === 'accTotal') { val = m.totalG - 1.0; scale = h * 0.55; }
          else if (series.id === 'accX') { val = m.ax; scale = h * 0.4; }
          else if (series.id === 'accY') { val = m.ay; scale = h * 0.4; }
          else if (series.id === 'accZ') { val = m.az - 1.0; scale = h * 0.4; }
          else if (series.id === 'gyrTotal') { val = m.totalGyr / 400; scale = h * 0.45; }
          else if (series.id === 'gyrX') { val = m.gx / 400; scale = h * 0.4; }
          else if (series.id === 'gyrY') { val = m.gy / 400; scale = h * 0.4; }
          else if (series.id === 'gyrZ') { val = m.gz / 400; scale = h * 0.4; }
          else if (series.id === 'angTotal') { val = m.totalAng / 50; scale = h * 0.45; }
          else if (series.id === 'roll') { val = m.roll / 50; scale = h * 0.4; }
          else if (series.id === 'pitch') { val = m.pitch / 50; scale = h * 0.4; }
          else if (series.id === 'yaw') { val = m.yaw / 180; scale = h * 0.4; }

          const x = frac * w;
          const y = Math.max(4, Math.min(h - 4, midY - (val * scale)));
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      const cx = w / 2;
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 2.0;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();
      ctx.setLineDash([]);

      const primarySeries = activeSeries[0];
      const curM = calcSensorMetrics(centerMs, isB);
      let pVal = curM.totalG - 1.0;
      let pScale = h * 0.55;
      if (primarySeries.id === 'accX') { pVal = curM.ax; pScale = h * 0.4; }
      const curY = Math.max(4, Math.min(h - 4, midY - (pVal * pScale)));
      ctx.fillStyle = primarySeries.color;
      ctx.beginPath();
      ctx.arc(cx, curY, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const f = Math.floor((ms % 1000) / 10);
      const min = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
    }

    function renderFrame() {
      drawRunner(ctxVA, cvA.width, cvA.height, timeA, '#00E5FF', false);
      drawDirectWaveOverlay(ctxWA, cwA.width, cwA.height, timeA, false);
      document.getElementById('timeA').innerText = formatTime(timeA);
      document.getElementById('seekA').value = timeA;

      drawRunner(ctxVB, cvB.width, cvB.height, timeB, '#FF7043', true);
      drawDirectWaveOverlay(ctxWB, cwB.width, cwB.height, timeB, true);
      document.getElementById('timeB').innerText = formatTime(timeB);
      document.getElementById('seekB').value = timeB;

      const ga = calcSensorMetrics(timeA, false).totalG;
      const gb = calcSensorMetrics(timeB, true).totalG;
      document.getElementById('valA').innerText = `${ga.toFixed(2)} G`;
      document.getElementById('valB').innerText = `${gb.toFixed(2)} G`;

      const diff = gb - ga;
      const sign = diff >= 0 ? '+' : '';
      const diffBadge = document.getElementById('diff-badge');
      diffBadge.innerText = `踏み込み差: ${sign}${diff.toFixed(2)}G (${diff >= 0 ? '動画Bが強力' : '動画Aが強力'})`;

      renderAnnotations();
    }

    let lastStamp = 0;
    function animLoop(stamp) {
      if (isPlaying) {
        if (!lastStamp) lastStamp = stamp;
        const delta = stamp - lastStamp;
        lastStamp = stamp;

        if (isSyncLocked) {
          timeA += delta * speedA;
          timeB = timeA + syncOffsetMs;
        } else {
          timeA += delta * speedA;
          timeB += delta * speedB;
        }

        if (timeA > totalMs) timeA = 0;
        if (timeB > totalMs) timeB = 0;
        if (timeA < 0) timeA = totalMs;
        if (timeB < 0) timeB = totalMs;

        renderFrame();
      } else {
        lastStamp = 0;
      }
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);
  </script>
</body>
</html>
