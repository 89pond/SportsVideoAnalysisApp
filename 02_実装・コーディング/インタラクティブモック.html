<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionSync Analytics - デュアル動画・波形統合分析</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 最上部 ミニマル情報ヘッダー */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 70%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 40;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #top-bar.hidden-ui {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .app-title {
      font-size: 13px;
      font-weight: 800;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diff-badge {
      background: rgba(255, 214, 0, 0.15);
      border: 1px solid rgba(255, 214, 0, 0.4);
      color: #FFD600;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      padding: 2px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .top-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .top-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .top-btn.rec-active { background: #FF5252; color: #fff; font-weight: bold; border-color: #FF5252; animation: pulse 1.5s infinite; }

    /* メイン 2画面スプリットビューポート */
    #viewport-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      background: #05070A;
    }

    .screen-half {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .screen-half.left-screen {
      border-right: 1px solid rgba(255,255,255,0.15);
    }

    .video-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* アノテーション手書きキャンバス (動画の手前レイヤー) */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      cursor: default;
      pointer-events: auto; /* 常時イベントを拾う */
    }

    /* タップでファイル名を表示するバッジ (再生時は自動非表示) */
    .file-badge {
      position: absolute;
      top: 46px;
      left: 14px;
      z-index: 25;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.6);
      color: #00E5FF;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: opacity 0.25s;
    }
    .file-badge.b {
      border-color: rgba(255, 112, 67, 0.7);
      color: #FF7043;
    }
    body.is-playing .file-badge {
      opacity: 0;
      pointer-events: none;
    }

    .video-time-badge {
      position: absolute;
      top: 46px;
      right: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity 0.3s;
    }
    body.is-playing .video-time-badge {
      opacity: 0.35;
    }

    /* 映像の上に直接透過オーバーレイする波形レイヤー */
    .wave-overlay-layer {
      position: absolute;
      bottom: 38px;
      left: 0;
      right: 0;
      height: 120px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 4px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.12) 75%, transparent 100%);
      pointer-events: none;
    }
    .wave-tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 3px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .wave-legend-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .wave-canvas {
      width: 100%;
      height: 90px;
    }

    /* 各動画専用の独立シークバー */
    .video-seekbar-panel {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      height: 26px;
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 13px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 25;
      transition: opacity 0.3s;
    }
    .seek-slider {
      flex: 1;
      height: 4px;
      accent-color: #00E5FF;
      cursor: pointer;
    }
    .seek-slider.b {
      accent-color: #FF7043;
    }

    /* 個別調整モード（🔓）時の専用コマ送りバー */
    .individual-ctrl-bar {
      position: absolute;
      bottom: 165px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .individual-ctrl-bar.active {
      display: flex;
    }
    .ind-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .ind-btn:hover { background: rgba(0,229,255,0.3); border-color: #00E5FF; }

    /* 中央下部に浮かぶ「極小スリガラス調ピルHUD」 */
    #floating-pill-hud {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 30, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 30px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 35;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s ease;
    }
    .pill-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pill-btn:hover { background: rgba(0,229,255,0.25); border-color: #00E5FF; }
    .pill-btn.primary {
      background: #00E5FF;
      color: #000;
      font-weight: bold;
      border-color: #00E5FF;
      padding: 4px 12px;
    }
    .pill-btn.lock-active {
      background: rgba(0, 230, 118, 0.2);
      border-color: #00E676;
      color: #00E676;
      font-weight: bold;
    }
    .pill-btn.unlock-active {
      background: rgba(255, 82, 82, 0.2);
      border-color: #FF5252;
      color: #FF5252;
      font-weight: bold;
    }

    /* ======================================================== */
    /* 参考画像に基づく「右端スリム縦型ツールバー」（幅48px）     */
    /* ======================================================== */
    #right-slender-bar {
      position: absolute;
      top: 50px;
      right: 8px;
      width: 48px;
      background: rgba(15, 20, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 50;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    #right-slender-bar.collapsed {
      transform: translateX(60px); /* 画面外へ最小化 */
    }

    /* 右端に常駐する最小化復元トグルタブ */
    #slender-bar-toggle {
      position: absolute;
      top: 50px;
      right: 0;
      width: 22px;
      height: 38px;
      background: rgba(0, 229, 255, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.6);
      border-right: none;
      border-radius: 8px 0 0 8px;
      display: none;
      align-items: center;
      justify-content: center;
      color: #00E5FF;
      font-size: 11px;
      cursor: pointer;
      z-index: 49;
    }
    #right-slender-bar.collapsed + #slender-bar-toggle {
      display: flex;
    }

    .tool-btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .tool-btn-icon:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
    }
    .tool-btn-icon.active {
      background: #00E5FF;
      color: #000;
      font-weight: bold;
      border-color: #00E5FF;
      box-shadow: 0 0 10px rgba(0,229,255,0.6);
    }
    .tool-btn-icon.danger:hover {
      background: rgba(255, 82, 82, 0.3);
      color: #FF5252;
    }

    .tool-divider {
      width: 28px;
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin: 2px 0;
    }

    /* カラー選択ポップオーバー (ツールバーの左側に展開) */
    #color-picker-popover {
      position: absolute;
      top: 240px;
      right: 60px;
      background: rgba(20, 26, 38, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 6px 10px;
      display: none;
      gap: 8px;
      z-index: 55;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    #color-picker-popover.show {
      display: flex;
    }
    .pop-color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }
    .pop-color-dot:hover { transform: scale(1.2); }
    .pop-color-dot.active { border-color: #fff; transform: scale(1.2); }

    /* 設定ドロワー (速度・波形項目) */
    #settings-drawer {
      position: absolute;
      top: 45px;
      left: 16px;
      width: 320px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(18, 24, 34, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 10px;
      padding: 12px;
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
    }
    #settings-drawer.active {
      display: flex;
    }
    .drawer-title {
      font-size: 12px;
      font-weight: bold;
      color: #00E5FF;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .section-label {
      font-size: 11px;
      color: #bbb;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .wave-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 3px;
    }
    .wave-check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      flex: 1;
    }
    .speed-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }
    .speed-slider {
      flex: 1;
      height: 4px;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <!-- 1. 最上部 ミニマル情報ヘッダー -->
  <div id="top-bar">
    <div class="app-title">
      <span>⚡ MotionSync</span>
      <span style="color:#aaa; font-size:11px; font-weight:normal;">| 左右2画面 デュアル分析</span>
    </div>
    <div class="diff-badge" id="diff-badge">
      踏み込み差: +0.42G (動画Bが強力)
    </div>
    <div class="top-actions">
      <button class="top-btn" id="rec-btn" onclick="toggleRecording(event)">🎥 指導動画録画</button>
      <button class="top-btn" id="settings-btn" onclick="toggleSettingsDrawer(event)">⚙ 波形・速度</button>
      <button class="top-btn" onclick="resetSync()">同期リセット</button>
    </div>
  </div>

  <!-- 設定ドロワー (速度・全波形選択) -->
  <div id="settings-drawer" onclick="event.stopPropagation()">
    <div class="drawer-title">
      <span>⚙️ 設定パレット</span>
      <span style="cursor:pointer; color:#FF5252;" onclick="toggleSettingsDrawer(event)">✕ 閉じる</span>
    </div>

    <div>
      <div class="section-label"><span>波形表示リスト (左右連動カラー):</span></div>
      <div id="wave-items-list"></div>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
      <div class="section-label">
        <span>動画A 速度: <span id="speed-label-a" style="color:#00E5FF; font-weight:bold;">0.25x</span></span>
      </div>
      <div class="speed-slider-row">
        <span>0.1x</span>
        <input type="range" class="speed-slider" id="speed-slider-a" min="0.1" max="2.0" step="0.05" value="0.25" oninput="setSpeed('A', this.value)" style="accent-color:#00E5FF;">
        <span>2.0x</span>
      </div>
    </div>
    <div>
      <div class="section-label">
        <span>動画B 速度: <span id="speed-label-b" style="color:#FF7043; font-weight:bold;">0.25x</span></span>
      </div>
      <div class="speed-slider-row">
        <span>0.1x</span>
        <input type="range" class="speed-slider" id="speed-slider-b" min="0.1" max="2.0" step="0.05" value="0.25" oninput="setSpeed('B', this.value)" style="accent-color:#FF7043;">
        <span>2.0x</span>
      </div>
    </div>
  </div>

  <!-- 2. メイン 2画面スプリットビューポート -->
  <div id="viewport-container">

    <!-- アノテーション描画キャンバス (全面透過) -->
    <canvas id="draw-canvas"></canvas>

    <!-- ================= 左画面: 動画 A ================= -->
    <div class="screen-half left-screen" id="screenA">
      <div class="file-badge" id="fileBadgeA" onclick="toggleFileName('A', event)">
        <span id="fileNameA">📁 20261015_秋季大会_走幅跳_決勝.mp4</span>
      </div>
      <div class="video-time-badge" id="timeA">00:03.20</div>

      <canvas id="canvas-video-a" class="video-canvas"></canvas>

      <div class="wave-overlay-layer" id="overlayA">
        <div class="wave-tag-row">
          <div class="wave-legend-group" id="legendA"></div>
          <span style="font-family:monospace; background:rgba(0,0,0,0.6); padding:1px 6px; border-radius:3px; border:1px solid #00E5FF; color:#00E5FF;" id="valA">1.85 G</span>
        </div>
        <canvas id="canvas-wave-a" class="wave-canvas"></canvas>
      </div>

      <div class="video-seekbar-panel" id="seekbar-panel-a" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#00E5FF; font-weight:bold;">A</span>
        <input type="range" id="seekA" class="seek-slider" min="0" max="10000" value="3200" oninput="onSeekSingle('A', this.value)">
      </div>

      <div class="individual-ctrl-bar" id="ind-ctrl-a" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#00E5FF; font-weight:bold;">動画A頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('A', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('A', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- ================= 右画面: 動画 B ================= -->
    <div class="screen-half right-screen" id="screenB">
      <div class="file-badge b" id="fileBadgeB" onclick="toggleFileName('B', event)">
        <span id="fileNameB">📁 20261102_県選手権_走幅跳_3回目.mp4</span>
      </div>
      <div class="video-time-badge" id="timeB">00:03.12</div>

      <canvas id="canvas-video-b" class="video-canvas"></canvas>

      <div class="wave-overlay-layer" id="overlayB">
        <div class="wave-tag-row">
          <div class="wave-legend-group" id="legendB"></div>
          <span style="font-family:monospace; background:rgba(0,0,0,0.6); padding:1px 6px; border-radius:3px; border:1px solid #FF7043; color:#FF7043;" id="valB">2.27 G</span>
        </div>
        <canvas id="canvas-wave-b" class="wave-canvas"></canvas>
      </div>

      <div class="video-seekbar-panel" id="seekbar-panel-b" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#FF7043; font-weight:bold;">B</span>
        <input type="range" id="seekB" class="seek-slider b" min="0" max="10000" value="3120" oninput="onSeekSingle('B', this.value)">
      </div>

      <div class="individual-ctrl-bar" id="ind-ctrl-b" onclick="event.stopPropagation()">
        <span style="font-size:10px; color:#FF7043; font-weight:bold;">動画B頭出し:</span>
        <button class="ind-btn" onclick="stepSingle('B', -33)">◀ 1コマ戻し</button>
        <button class="ind-btn" onclick="stepSingle('B', 33)">1コマ送り ▶</button>
      </div>
    </div>

    <!-- 3. 中央下部に浮かぶ「極小スリガラス調ピルHUD」 -->
    <div id="floating-pill-hud">
      <button class="pill-btn lock-active" id="sync-lock-btn" onclick="toggleSyncLock(event)" title="同期 / 個別頭出し切替">
        <span id="lock-icon">🔒</span> <span id="lock-text">同期中</span>
      </button>

      <button class="pill-btn" onclick="stepDual(-33, event)">◀ 1コマ</button>

      <button class="pill-btn primary" id="play-btn" onclick="togglePlay(event)">
        <span id="play-icon">❚❚</span> 一時停止
      </button>

      <button class="pill-btn" onclick="stepDual(33, event)">1コマ ▶</button>

      <div style="display:flex; gap:2px; margin-left:2px; border-left:1px solid rgba(255,255,255,0.15); padding-left:6px;">
        <button class="pill-btn" style="padding:4px 7px; font-size:10px;" onclick="adjustOffset(-10, event)">-0.01s</button>
        <button class="pill-btn" style="padding:4px 7px; font-size:10px;" onclick="adjustOffset(10, event)">+0.01s</button>
      </div>
    </div>

    <!-- ======================================================== -->
    <!-- 参考画像に基づく「画面右端のスリム縦型ツールバー」（幅48px） -->
    <!-- ======================================================== -->
    <div id="right-slender-bar" onclick="event.stopPropagation()">
      <!-- 最小化ボタン -->
      <button class="tool-btn-icon" onclick="toggleSlenderBar()" title="ツールバーを隠す">
        <span style="font-size:11px;">▶</span>
      </button>

      <div class="tool-divider"></div>

      <!-- 👆 選択・移動 -->
      <button class="tool-btn-icon active" id="btn-tool-select" onclick="setDrawTool('select')" title="図形・文字を選択・移動">
        <span>👆</span>
      </button>

      <!-- 〰 フリーハンド手書き -->
      <button class="tool-btn-icon" id="btn-tool-pen" onclick="setDrawTool('pen')" title="フリーハンド線を描く">
        <span style="font-size:16px;">✏️</span>
      </button>

      <!-- ／ 直線・矢印 -->
      <button class="tool-btn-icon" id="btn-tool-arrow" onclick="setDrawTool('arrow')" title="矢印ラインを描く">
        <span>↗️</span>
      </button>

      <!-- ○ 円・楕円マーカー -->
      <button class="tool-btn-icon" id="btn-tool-circle" onclick="setDrawTool('circle')" title="円・サークルを描く">
        <span style="font-size:17px;">⭕</span>
      </button>

      <!-- ∡ 3点角度計測 -->
      <button class="tool-btn-icon" id="btn-tool-angle" onclick="setDrawTool('angle')" title="3点タップで関節角度を計測">
        <span>📐</span>
      </button>

      <!-- T 文字テキスト入力 -->
      <button class="tool-btn-icon" id="btn-tool-text" onclick="setDrawTool('text')" title="文字・指導コメントを入力">
        <span style="font-weight:bold; font-family:serif;">T</span>
      </button>

      <div class="tool-divider"></div>

      <!-- 🎨 カラー選択ボタン -->
      <button class="tool-btn-icon" id="btn-color-pick" onclick="toggleColorPopover(event)" title="色を変更">
        <span id="current-color-badge" style="display:inline-block; width:16px; height:16px; border-radius:50%; background:#FFD600; border:2px solid #fff;"></span>
      </button>

      <!-- ↩ Undo (元に戻す) -->
      <button class="tool-btn-icon" onclick="undoAnnotation()" title="直前の描画を元に戻す">
        <span>↩</span>
      </button>

      <!-- 🗑 選択したオブジェクトを削除 -->
      <button class="tool-btn-icon danger" onclick="deleteSelected()" title="選択中の図形・文字を削除">
        <span>🗑</span>
      </button>
    </div>

    <!-- 最小化復元トグルタブ -->
    <div id="slender-bar-toggle" onclick="toggleSlenderBar()" title="ツールバーを表示">
      <span>◀</span>
    </div>

    <!-- カラー選択ポップオーバー -->
    <div id="color-picker-popover" onclick="event.stopPropagation()">
      <span class="pop-color-dot active" style="background:#FFD600;" onclick="selectDrawColor('#FFD600')"></span>
      <span class="pop-color-dot" style="background:#FF5252;" onclick="selectDrawColor('#FF5252')"></span>
      <span class="pop-color-dot" style="background:#00E5FF;" onclick="selectDrawColor('#00E5FF')"></span>
      <span class="pop-color-dot" style="background:#69F0AE;" onclick="selectDrawColor('#69F0AE')"></span>
      <span class="pop-color-dot" style="background:#FFFFFF;" onclick="selectDrawColor('#FFFFFF')"></span>
    </div>

  </div>

  <script>
    // --- 状態管理 ---
    let isPlaying = true;
    let isSyncLocked = true;
    let isRecording = false;

    let timeA = 3200;
    let timeB = 3120;
    let syncOffsetMs = timeB - timeA;
    let totalMs = 10000;

    let speedA = 0.25;
    let speedB = 0.25;

    // 描画ツール: 'select', 'pen', 'arrow', 'circle', 'angle', 'text'
    let currentTool = 'select';
    let drawColor = '#FFD600';
    let currentLineWidth = 3.5;

    let annotations = []; // { id, type, points: [{x,y}], text, angle, color, lineWidth }
    let selectedAnnotation = null;
    let isDraggingSelected = false;
    let dragStartPt = null;
    let tempPoints = [];

    // 全波形系列定義
    const WAVE_SERIES = [
      { id: 'accTotal', label: 'Acc 合成G (合算)', color: '#FFD740', selected: true },
      { id: 'accX',     label: 'Acc X軸 (前後)',   color: '#FF5252', selected: true },
      { id: 'accY',     label: 'Acc Y軸 (左右)',   color: '#69F0AE', selected: false },
      { id: 'accZ',     label: 'Acc Z軸 (垂直)',   color: '#40C4FF', selected: false },
      { id: 'gyrTotal', label: 'Gyro 合成 (合算)', color: '#FF4081', selected: false },
      { id: 'gyrX',     label: 'Gyro X軸 (ロール)', color: '#FF9100', selected: false },
      { id: 'gyrY',     label: 'Gyro Y軸 (ピッチ)', color: '#00E676', selected: false },
      { id: 'gyrZ',     label: 'Gyro Z軸 (ヨー)',   color: '#7C4DFF', selected: false },
      { id: 'angTotal', label: 'Angle 合成 (傾斜)', color: '#FFFFFF', selected: false },
    ];

    // キャンバス取得
    const cvA = document.getElementById('canvas-video-a');
    const ctxVA = cvA.getContext('2d');
    const cvB = document.getElementById('canvas-video-b');
    const ctxVB = cvB.getContext('2d');

    const cwA = document.getElementById('canvas-wave-a');
    const ctxWA = cwA.getContext('2d');
    const cwB = document.getElementById('canvas-wave-b');
    const ctxWB = cwB.getContext('2d');

    const cd = document.getElementById('draw-canvas');
    const ctxD = cd.getContext('2d');

    function resize() {
      cvA.width = cvA.parentElement.clientWidth;
      cvA.height = cvA.parentElement.clientHeight;
      cvB.width = cvB.parentElement.clientWidth;
      cvB.height = cvB.parentElement.clientHeight;

      cwA.width = cwA.parentElement.clientWidth;
      cwA.height = cwA.parentElement.clientHeight;
      cwB.width = cwB.parentElement.clientWidth;
      cwB.height = cwB.parentElement.clientHeight;

      cd.width = cd.parentElement.clientWidth;
      cd.height = cd.parentElement.clientHeight;

      renderAnnotations();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('load', () => {
      initWaveSettingsList();
      resize();
      initCanvasDrawEvents();
      renderFrame();
    });

    // --- 右端スリムバーの最小化／展開 ---
    function toggleSlenderBar() {
      const bar = document.getElementById('right-slender-bar');
      bar.classList.toggle('collapsed');
      document.getElementById('color-picker-popover').classList.remove('show');
    }

    // --- 描画ツールの選択 ---
    function setDrawTool(tool) {
      currentTool = tool;
      tempPoints = [];
      document.querySelectorAll('#right-slender-bar .tool-btn-icon').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-tool-${tool}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('color-picker-popover').classList.remove('show');

      // カーソル形状の更新
      if (tool === 'select') cd.style.cursor = 'default';
      else if (tool === 'text') cd.style.cursor = 'text';
      else cd.style.cursor = 'crosshair';

      renderAnnotations();
    }

    // --- カラーパレットのポップオーバー開閉 ＆ 選択 ---
    function toggleColorPopover(e) {
      if (e) e.stopPropagation();
      const pop = document.getElementById('color-picker-popover');
      pop.classList.toggle('show');
    }

    function selectDrawColor(color) {
      drawColor = color;
      document.getElementById('current-color-badge').style.backgroundColor = color;
      document.querySelectorAll('.pop-color-dot').forEach(d => {
        d.classList.toggle('active', d.style.backgroundColor === color || rgbToHex(d.style.backgroundColor) === color);
      });
      document.getElementById('color-picker-popover').classList.remove('show');

      // 選択中のオブジェクトがあれば即座に色を変更！
      if (selectedAnnotation) {
        selectedAnnotation.color = color;
        renderAnnotations();
      }
    }

    // --- 選択したオブジェクトの削除 ---
    function deleteSelected() {
      if (selectedAnnotation) {
        annotations = annotations.filter(a => a !== selectedAnnotation);
        selectedAnnotation = null;
        renderAnnotations();
      } else if (annotations.length > 0) {
        // 何も選択していない場合は末尾のものを削除
        annotations.pop();
        renderAnnotations();
      }
    }

    // --- 元に戻す (Undo) ---
    function undoAnnotation() {
      if (annotations.length > 0) {
        annotations.pop();
        selectedAnnotation = null;
        renderAnnotations();
      }
    }

    // --- キャンバス描画イベント (バグを完全解消・確実に描けるロジック) ---
    function initCanvasDrawEvents() {
      let isMouseDown = false;

      cd.addEventListener('mousedown', e => {
        const rect = cd.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

        // 1. 選択モード時
        if (currentTool === 'select') {
          selectedAnnotation = findHitAnnotation(pt);
          if (selectedAnnotation) {
            isDraggingSelected = true;
            dragStartPt = pt;
          }
          renderAnnotations();
          return;
        }

        // 2. 角度計測モード時 (3点タップ)
        if (currentTool === 'angle') {
          tempPoints.push(pt);
          if (tempPoints.length === 3) {
            const angle = calcAngle(tempPoints[0], tempPoints[1], tempPoints[2]);
            const newObj = {
              id: Date.now(),
              type: 'angle',
              points: [...tempPoints],
              angle,
              color: drawColor,
              lineWidth: currentLineWidth
            };
            annotations.push(newObj);
            selectedAnnotation = newObj;
            tempPoints = [];
          }
          renderAnnotations();
          return;
        }

        // 3. 文字入力モード時 (タップでダイアログ)
        if (currentTool === 'text') {
          const text = prompt('選手への指導コメント・指示を入力してください:', 'ここで前傾キープ！');
          if (text) {
            const newObj = {
              id: Date.now(),
              type: 'text',
              points: [pt],
              text,
              color: drawColor,
              fontSize: 16
            };
            annotations.push(newObj);
            selectedAnnotation = newObj;
            renderAnnotations();
          }
          return;
        }

        // 4. フリーハンド線・矢印・円
        isMouseDown = true;
        tempPoints = [pt];
      });

      cd.addEventListener('mousemove', e => {
        const rect = cd.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

        // 選択中オブジェクトのドラッグ移動
        if (isDraggingSelected && selectedAnnotation) {
          const dx = pt.x - dragStartPt.x;
          const dy = pt.y - dragStartPt.y;
          selectedAnnotation.points.forEach(p => {
            p.x += dx;
            p.y += dy;
          });
          dragStartPt = pt;
          renderAnnotations();
          return;
        }

        if (!isMouseDown) return;

        if (currentTool === 'pen') {
          tempPoints.push(pt);
        } else if (currentTool === 'arrow' || currentTool === 'circle') {
          tempPoints[1] = pt; // 終点更新
        }
        renderAnnotations();
      });

      window.addEventListener('mouseup', () => {
        if (isDraggingSelected) {
          isDraggingSelected = false;
        }

        if (isMouseDown && tempPoints.length > 0) {
          if (currentTool === 'pen' && tempPoints.length > 1) {
            const newObj = {
              id: Date.now(),
              type: 'pen',
              points: [...tempPoints],
              color: drawColor,
              lineWidth: currentLineWidth
            };
            annotations.push(newObj);
            selectedAnnotation = newObj;
          } else if ((currentTool === 'arrow' || currentTool === 'circle') && tempPoints.length >= 2) {
            const newObj = {
              id: Date.now(),
              type: currentTool,
              points: [...tempPoints],
              color: drawColor,
              lineWidth: currentLineWidth
            };
            annotations.push(newObj);
            selectedAnnotation = newObj;
          }
          tempPoints = [];
          isMouseDown = false;
          renderAnnotations();
        }
      });
    }

    // ヒットテスト (クリック位置にあるオブジェクトを探す)
    function findHitAnnotation(pt) {
      for (let i = annotations.length - 1; i >= 0; i--) {
        const a = annotations[i];
        if (a.type === 'text') {
          const p = a.points[0];
          if (Math.abs(pt.x - p.x) < 80 && Math.abs(pt.y - p.y) < 25) return a;
        } else {
          for (const p of a.points) {
            if (Math.hypot(pt.x - p.x, pt.y - p.y) < 30) return a;
          }
        }
      }
      return null;
    }

    function calcAngle(pA, pB, pC) {
      const v1x = pA.x - pB.x, v1y = pA.y - pB.y;
      const v2x = pC.x - pB.x, v2y = pC.y - pB.y;
      const dot = v1x * v2x + v1y * v2y;
      const len1 = Math.sqrt(v1x * v1x + v1y * v1y);
      const len2 = Math.sqrt(v2x * v2x + v2y * v2y);
      if (len1 === 0 || len2 === 0) return '0.0';
      const cosT = Math.max(-1, Math.min(1, dot / (len1 * len2)));
      return (Math.acos(cosT) * (180 / Math.PI)).toFixed(1);
    }

    // アノテーション描画
    function renderAnnotations() {
      ctxD.clearRect(0, 0, cd.width, cd.height);

      const allObjs = [...annotations];
      if (tempPoints.length > 0) {
        allObjs.push({
          type: currentTool,
          points: tempPoints,
          color: drawColor,
          lineWidth: currentLineWidth
        });
      }

      allObjs.forEach(obj => {
        ctxD.strokeStyle = obj.color;
        ctxD.fillStyle = obj.color;
        ctxD.lineWidth = obj.lineWidth || currentLineWidth;
        ctxD.lineCap = 'round';
        ctxD.lineJoin = 'round';

        // 1. フリーハンド線
        if (obj.type === 'pen' && obj.points.length > 1) {
          ctxD.beginPath();
          obj.points.forEach((p, idx) => {
            if (idx === 0) ctxD.moveTo(p.x, p.y);
            else ctxD.lineTo(p.x, p.y);
          });
          ctxD.stroke();
        }
        // 2. 矢印直線
        else if (obj.type === 'arrow' && obj.points.length >= 2) {
          const p1 = obj.points[0], p2 = obj.points[1];
          ctxD.beginPath(); ctxD.moveTo(p1.x, p1.y); ctxD.lineTo(p2.x, p2.y); ctxD.stroke();
          const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
          ctxD.beginPath();
          ctxD.moveTo(p2.x, p2.y);
          ctxD.lineTo(p2.x - 14 * Math.cos(ang - 0.4), p2.y - 14 * Math.sin(ang - 0.4));
          ctxD.lineTo(p2.x - 14 * Math.cos(ang + 0.4), p2.y - 14 * Math.sin(ang + 0.4));
          ctxD.fill();
        }
        // 3. 円・楕円サークル (確実に描画されるロジック)
        else if (obj.type === 'circle' && obj.points.length >= 2) {
          const p1 = obj.points[0], p2 = obj.points[1];
          const rx = Math.max(8, Math.abs(p2.x - p1.x));
          const ry = Math.max(8, Math.abs(p2.y - p1.y));
          ctxD.beginPath();
          ctxD.ellipse(p1.x, p1.y, rx, ry, 0, 0, Math.PI * 2);
          ctxD.stroke();
        }
        // 4. 3点角度
        else if (obj.type === 'angle') {
          ctxD.beginPath();
          obj.points.forEach((p, idx) => {
            ctxD.arc(p.x, p.y, 5, 0, Math.PI * 2);
            if (idx > 0) {
              ctxD.moveTo(obj.points[idx-1].x, obj.points[idx-1].y);
              ctxD.lineTo(p.x, p.y);
            }
          });
          ctxD.stroke();
          if (obj.angle && obj.points.length === 3) {
            const b = obj.points[1];
            ctxD.fillStyle = '#FFD600';
            ctxD.fillRect(b.x + 10, b.y - 24, 60, 20);
            ctxD.fillStyle = '#000';
            ctxD.font = 'bold 12px sans-serif';
            ctxD.fillText(`${obj.angle}°`, b.x + 15, b.y - 10);
          }
        }
        // 5. テキスト指導コメント
        else if (obj.type === 'text') {
          const p = obj.points[0];
          ctxD.font = 'bold 15px sans-serif';
          const textW = ctxD.measureText(obj.text).width;
          ctxD.fillStyle = 'rgba(0,0,0,0.85)';
          ctxD.fillRect(p.x - 4, p.y - 18, textW + 16, 26);
          ctxD.strokeStyle = obj.color;
          ctxD.strokeRect(p.x - 4, p.y - 18, textW + 16, 26);
          ctxD.fillStyle = obj.color;
          ctxD.fillText(obj.text, p.x + 4, p.y - 1);
        }

        // 選択中オブジェクトのハイライト枠描画
        if (obj === selectedAnnotation && currentTool === 'select') {
          drawSelectionBox(obj);
        }
      });
    }

    function drawSelectionBox(obj) {
      ctxD.strokeStyle = '#00E5FF';
      ctxD.lineWidth = 1.5;
      ctxD.setLineDash([4, 4]);

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      obj.points.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      if (obj.type === 'text') {
        ctxD.font = 'bold 15px sans-serif';
        const textW = ctxD.measureText(obj.text).width;
        minX -= 6; maxX = minX + textW + 20;
        minY -= 20; maxY = minY + 30;
      } else {
        minX -= 12; minY -= 12; maxX += 12; maxY += 12;
      }

      ctxD.strokeRect(minX, minY, maxX - minX, maxY - minY);
      ctxD.setLineDash([]);

      ctxD.fillStyle = '#00E5FF';
      const handleSize = 6;
      ctxD.fillRect(minX - handleSize/2, minY - handleSize/2, handleSize, handleSize);
      ctxD.fillRect(maxX - handleSize/2, minY - handleSize/2, handleSize, handleSize);
      ctxD.fillRect(minX - handleSize/2, maxY - handleSize/2, handleSize, handleSize);
      ctxD.fillRect(maxX - handleSize/2, maxY - handleSize/2, handleSize, handleSize);
    }

    // --- 🎥 フィードバック動画録画・書き出し ---
    function toggleRecording(e) {
      if (e) e.stopPropagation();
      isRecording = !isRecording;
      const btn = document.getElementById('rec-btn');
      if (isRecording) {
        btn.classList.add('rec-active');
        btn.innerHTML = '🔴 録画中... (タップで完了)';
      } else {
        btn.classList.remove('rec-active');
        btn.innerHTML = '🎥 指導動画録画';
        alert('【選手フィードバック動画エクスポート完了】\n\n' +
              '・左右比較動画\n' +
              '・センサー加速度波形オーバーレイ\n' +
              '・描画した円・線・角度（📐）・指導テキスト（💬）\n\n' +
              'を重畳統合した高画質MP4動画（Feedback_Analysis_Export.mp4）を書き出しました！\n' +
              '選手へLINEやAirDropで即座に送信できます。');
      }
    }

    // --- 波形設定リスト生成 ---
    function initWaveSettingsList() {
      const container = document.getElementById('wave-items-list');
      container.innerHTML = '';

      WAVE_SERIES.forEach((s) => {
        const row = document.createElement('div');
        row.className = `wave-item-row`;

        const labelBox = document.createElement('div');
        labelBox.className = 'wave-check-label';
        labelBox.innerHTML = `
          <input type="checkbox" ${s.selected ? 'checked' : ''} style="accent-color:${s.color}; cursor:pointer;">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${s.color};"></span>
          <span>${s.label}</span>
        `;
        labelBox.onclick = () => {
          s.selected = !s.selected;
          labelBox.querySelector('input').checked = s.selected;
          updateLegends();
          renderFrame();
        };

        row.appendChild(labelBox);
        container.appendChild(row);
      });

      updateLegends();
    }

    function updateLegends() {
      const legA = document.getElementById('legendA');
      const legB = document.getElementById('legendB');
      legA.innerHTML = '';
      legB.innerHTML = '';

      const active = WAVE_SERIES.filter(s => s.selected);
      active.forEach(s => {
        const itemA = document.createElement('div');
        itemA.className = 'legend-item';
        itemA.innerHTML = `<span class="legend-dot" style="background:${s.color};"></span><span>${s.label}</span>`;
        legA.appendChild(itemA);

        const itemB = document.createElement('div');
        itemB.className = 'legend-item';
        itemB.innerHTML = `<span class="legend-dot" style="background:${s.color};"></span><span>${s.label}</span>`;
        legB.appendChild(itemB);
      });
    }

    function toggleSettingsDrawer(e) {
      if (e) e.stopPropagation();
      document.getElementById('settings-drawer').classList.toggle('active');
    }

    function setSpeed(target, val) {
      const num = parseFloat(val);
      if (target === 'A') {
        speedA = num;
        document.getElementById('speed-label-a').innerText = `${num.toFixed(2)}x`;
      } else {
        speedB = num;
        document.getElementById('speed-label-b').innerText = `${num.toFixed(2)}x`;
      }
    }

    function toggleFileName(target, e) {
      if (e) e.stopPropagation();
      const name = target === 'A' ? '20261015_秋季大会_走幅跳_決勝.mp4' : '20261102_県選手権_走幅跳_3回目.mp4';
      alert(`ファイル名 [動画${target}]:\n${name}`);
    }

    function togglePlay(e) {
      if (e) e.stopPropagation();
      isPlaying = !isPlaying;
      document.body.classList.toggle('is-playing', isPlaying);
      document.getElementById('play-icon').innerText = isPlaying ? '❚❚' : '▶';
      document.getElementById('play-btn').innerHTML = isPlaying ? '<span id="play-icon">❚❚</span> 一時停止' : '<span id="play-icon">▶</span> 再生';
    }

    function toggleSyncLock(e) {
      if (e) e.stopPropagation();
      isSyncLocked = !isSyncLocked;
      const btn = document.getElementById('sync-lock-btn');
      const icon = document.getElementById('lock-icon');
      const text = document.getElementById('lock-text');

      const indA = document.getElementById('ind-ctrl-a');
      const indB = document.getElementById('ind-ctrl-b');

      if (isSyncLocked) {
        syncOffsetMs = timeB - timeA;
        btn.className = 'pill-btn lock-active';
        icon.innerText = '🔒';
        text.innerText = '同期中';
        indA.classList.remove('active');
        indB.classList.remove('active');
      } else {
        btn.className = 'pill-btn unlock-active';
        icon.innerText = '🔓';
        text.innerText = '個別頭出し中';
        indA.classList.add('active');
        indB.classList.add('active');
      }
    }

    function stepDual(ms, e) {
      if (e) e.stopPropagation();
      if (isPlaying) togglePlay();
      timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      renderFrame();
    }

    function stepSingle(target, ms) {
      if (isPlaying) togglePlay();
      if (target === 'A') {
        timeA = Math.max(0, Math.min(totalMs, timeA + ms));
      } else {
        timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      }
      renderFrame();
    }

    function onSeekSingle(target, val) {
      const ms = parseInt(val);
      if (target === 'A') {
        timeA = ms;
        if (isSyncLocked) timeB = Math.max(0, Math.min(totalMs, timeA + syncOffsetMs));
      } else {
        timeB = ms;
        if (isSyncLocked) timeA = Math.max(0, Math.min(totalMs, timeB - syncOffsetMs));
      }
      renderFrame();
    }

    function adjustOffset(ms, e) {
      if (e) e.stopPropagation();
      timeB = Math.max(0, Math.min(totalMs, timeB + ms));
      syncOffsetMs = timeB - timeA;
      renderFrame();
    }

    function resetSync() {
      timeA = 3200;
      timeB = 3200;
      syncOffsetMs = 0;
      renderFrame();
    }

    function calcSensorMetrics(tMs, isB) {
      const t = tMs / 1000;
      const factor = isB ? 1.05 : 1.0;
      const p = t * (isB ? 3.5 : 3.4);
      const base = Math.sin(p);

      const ax = Math.sin(p) * 1.5 * factor;
      const ay = Math.cos(p) * 0.9 * factor;
      const az = 1.0 + (base > 0 ? Math.pow(base, isB ? 2.3 : 2.0) * (isB ? 1.4 : 1.0) : base * 0.3);
      const totalG = Math.sqrt(ax * ax + ay * ay + az * az);

      const gx = Math.cos(p) * 280 * factor;
      const gy = Math.sin(p * 1.2) * 200 * factor;
      const gz = Math.cos(p * 0.8) * 150 * factor;
      const totalGyr = Math.sqrt(gx * gx + gy * gy + gz * gz);

      const roll = Math.sin(t) * 35;
      const pitch = Math.cos(t * 1.2) * 25;
      const yaw = ((t * 40) % 360) - 180;
      const totalAng = Math.sqrt(roll * roll + pitch * pitch);

      return { ax, ay, az, totalG, gx, gy, gz, totalGyr, roll, pitch, yaw, totalAng };
    }

    function drawRunner(ctx, w, h, tMs, color, isSharp) {
      ctx.clearRect(0, 0, w, h);
      const t = tMs / 1000;
      const groundY = h * 0.78;

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, groundY); ctx.lineTo(w, groundY);
      ctx.stroke();

      for (let x = (t * 80) % 50; x < w; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, groundY); ctx.lineTo(x - 25, h);
        ctx.stroke();
      }

      const p = t * (isSharp ? 3.5 : 3.4);
      const bounce = Math.abs(Math.sin(p)) * (isSharp ? 18 : 13);
      const cx = w * 0.5;
      const cy = groundY - 50 - bounce;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(cx, cy - 25, 9, 0, Math.PI * 2);
      ctx.fill();

      const forwardLean = isSharp ? 7 : 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 16);
      ctx.lineTo(cx - forwardLean, cy + 18);
      ctx.stroke();

      const arm = Math.sin(p) * (isSharp ? 0.9 : 0.75);
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + Math.cos(arm) * 22, cy - 8 + Math.sin(arm) * 22);
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx - Math.cos(arm) * 22, cy - 8 - Math.sin(arm) * 22);
      ctx.stroke();

      const leg1 = Math.cos(p) * (isSharp ? 1.0 : 0.85);
      const leg2 = -Math.cos(p) * (isSharp ? 1.0 : 0.85);

      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k1x = cx - forwardLean + Math.sin(leg1) * 20;
      const k1y = cy + 18 + Math.cos(leg1) * 20;
      ctx.lineTo(k1x, k1y);
      ctx.lineTo(k1x + Math.sin(leg1 - 0.35) * 20, k1y + Math.cos(leg1 - 0.35) * 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - forwardLean, cy + 18);
      const k2x = cx - forwardLean + Math.sin(leg2) * 20;
      const k2y = cy + 18 + Math.cos(leg2) * 20;
      ctx.lineTo(k2x, k2y);
      ctx.lineTo(k2x + Math.sin(leg2 - 0.35) * 20, k2y + Math.cos(leg2 - 0.35) * 20);
      ctx.stroke();

      if (bounce < 2.5) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.ellipse(k1x, groundY, isSharp ? 20 : 13, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawDirectWaveOverlay(ctx, w, h, centerMs, isB) {
      ctx.clearRect(0, 0, w, h);

      const midY = h * 0.65;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(0, midY); ctx.lineTo(w, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      const windowMs = 4000;
      const pts = 65;

      const activeSeries = WAVE_SERIES.filter(s => s.selected);
      if (activeSeries.length === 0) return;

      activeSeries.forEach(series => {
        ctx.strokeStyle = series.color;
        ctx.lineWidth = series.id.includes('Total') ? 2.8 : 1.6;
        ctx.shadowColor = series.color;
        ctx.shadowBlur = series.id.includes('Total') ? 6 : 0;
        ctx.beginPath();

        for (let i = 0; i <= pts; i++) {
          const frac = i / pts;
          const curMs = (centerMs - 2000) + (frac * windowMs);
          const m = calcSensorMetrics(curMs, isB);

          let val = 0;
          let scale = h * 0.5;
          if (series.id === 'accTotal') { val = m.totalG - 1.0; scale = h * 0.55; }
          else if (series.id === 'accX') { val = m.ax; scale = h * 0.4; }
          else if (series.id === 'accY') { val = m.ay; scale = h * 0.4; }
          else if (series.id === 'accZ') { val = m.az - 1.0; scale = h * 0.4; }
          else if (series.id === 'gyrTotal') { val = m.totalGyr / 400; scale = h * 0.45; }
          else if (series.id === 'gyrX') { val = m.gx / 400; scale = h * 0.4; }
          else if (series.id === 'gyrY') { val = m.gy / 400; scale = h * 0.4; }
          else if (series.id === 'gyrZ') { val = m.gz / 400; scale = h * 0.4; }
          else if (series.id === 'angTotal') { val = m.totalAng / 50; scale = h * 0.45; }

          const x = frac * w;
          const y = Math.max(4, Math.min(h - 4, midY - (val * scale)));
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      const cx = w / 2;
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 2.0;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const f = Math.floor((ms % 1000) / 10);
      const min = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
    }

    function renderFrame() {
      drawRunner(ctxVA, cvA.width, cvA.height, timeA, '#00E5FF', false);
      drawDirectWaveOverlay(ctxWA, cwA.width, cwA.height, timeA, false);
      document.getElementById('timeA').innerText = formatTime(timeA);
      document.getElementById('seekA').value = timeA;

      drawRunner(ctxVB, cvB.width, cvB.height, timeB, '#FF7043', true);
      drawDirectWaveOverlay(ctxWB, cwB.width, cwB.height, timeB, true);
      document.getElementById('timeB').innerText = formatTime(timeB);
      document.getElementById('seekB').value = timeB;

      const ga = calcSensorMetrics(timeA, false).totalG;
      const gb = calcSensorMetrics(timeB, true).totalG;
      document.getElementById('valA').innerText = `${ga.toFixed(2)} G`;
      document.getElementById('valB').innerText = `${gb.toFixed(2)} G`;

      const diff = gb - ga;
      const sign = diff >= 0 ? '+' : '';
      const diffBadge = document.getElementById('diff-badge');
      diffBadge.innerText = `踏み込み差: ${sign}${diff.toFixed(2)}G (${diff >= 0 ? '動画Bが強力' : '動画Aが強力'})`;

      renderAnnotations();
    }

    function rgbToHex(rgb) {
      if (rgb.startsWith('#')) return rgb;
      const rgbValues = rgb.match(/\d+/g);
      if (!rgbValues) return rgb;
      return '#' + rgbValues.slice(0,3).map(x => parseInt(x).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    let lastStamp = 0;
    function animLoop(stamp) {
      if (isPlaying) {
        if (!lastStamp) lastStamp = stamp;
        const delta = stamp - lastStamp;
        lastStamp = stamp;

        if (isSyncLocked) {
          timeA += delta * speedA;
          timeB = timeA + syncOffsetMs;
        } else {
          timeA += delta * speedA;
          timeB += delta * speedB;
        }

        if (timeA > totalMs) timeA = 0;
        if (timeB > totalMs) timeB = 0;
        if (timeA < 0) timeA = totalMs;
        if (timeB < 0) timeB = totalMs;

        renderFrame();
      } else {
        lastStamp = 0;
      }
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);
  </script>
</body>
