<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotionSync Analytics - インタラクティブ動作モック</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #121418; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header */
    header { background: #1E222B; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .logo-area { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 15px; color: #00E5FF; }
    .mode-selector { display: flex; background: #262C38; border-radius: 6px; padding: 2px; gap: 2px; }
    .mode-btn { background: transparent; border: none; color: #aaa; padding: 5px 12px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    .mode-btn.active { background: #00E5FF; color: #000; font-weight: bold; }
    .menu-btn { background: #262C38; border: 1px solid rgba(255,255,255,0.1); color: #00E5FF; border-radius: 4px; padding: 6px 12px; font-size: 11px; cursor: pointer; }

    /* Video Viewport */
    #viewport-container { flex: 5; position: relative; background: #0A0C10; overflow: hidden; display: flex; }
    .video-box { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); background: #14171E; }
    .video-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid #00E5FF; color: #00E5FF; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; pointer-events: none; z-index: 5; }
    .video-badge.b { border-color: #FF5252; color: #FF5252; }
    .dummy-athlete { width: 120px; height: 180px; position: relative; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .dummy-head { width: 28px; height: 28px; background: currentColor; border-radius: 50%; margin-bottom: 8px; }
    .dummy-body { width: 6px; height: 60px; background: currentColor; border-radius: 3px; position: relative; }
    .dummy-limb { position: absolute; width: 4px; height: 45px; background: currentColor; transform-origin: top center; border-radius: 2px; }

    /* Ghost Overlay slider */
    #ghost-slider-panel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); border: 1px solid #7C4DFF; border-radius: 20px; padding: 4px 12px; display: none; align-items: center; gap: 8px; z-index: 10; font-size: 11px; }

    /* Annotation Canvas */
    #draw-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 8; cursor: crosshair; }

    /* Playback Bar */
    #playback-bar { background: #262C38; padding: 6px 16px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,0.08); }
    .seek-row { display: flex; align-items: center; gap: 12px; font-family: monospace; font-size: 12px; color: #00E5FF; }
    .seek-slider { flex: 1; accent-color: #00E5FF; cursor: pointer; }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; }
    .btn { background: #1E222B; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn.active-lock { border-color: #00E676; color: #00E676; }
    .play-circle { width: 32px; height: 32px; border-radius: 50%; background: #00E5FF; color: #000; border: none; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* HUD Bar */
    #hud-bar { background: #1E222B; padding: 6px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); }
    .hud-lap { background: rgba(0,229,255,0.15); border: 1px solid #00E5FF; color: #00E5FF; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .hud-diff { font-weight: bold; font-size: 12px; color: #00E676; margin-left: 10px; }
    .hud-gauge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #FFD600; font-weight: bold; }
    .gauge-bar { width: 70px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .gauge-fill { height: 100%; background: #FFD600; width: 45%; transition: width 0.1s; }

    /* Waveform Area */
    #waveform-area { flex: 3; background: #121418; display: flex; flex-direction: column; position: relative; border-top: 1px solid rgba(255,255,255,0.06); transition: all 0.25s ease; }
    #waveform-area.collapsed { display: none; }

    /* HUD Scope Overlay (スマホ横向き向け波形オーバーレイ) */
    #scope-overlay-hud {
      position: absolute;
      top: 12px;
      bottom: 12px;
      right: 12px;
      width: 320px;
      background: rgba(15, 18, 24, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 25;
      display: none;
      flex-direction: column;
      overflow: hidden;
      transition: right 0.2s, left 0.2s, opacity 0.2s;
    }
    #scope-overlay-hud.pos-left {
      right: auto;
      left: 12px;
    }
    .scope-header {
      background: rgba(255,255,255,0.06);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
    }
    .scope-title {
      font-weight: bold;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scope-ctrls {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .mini-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
    }
    .mini-btn:hover { background: rgba(0,229,255,0.2); border-color: #00E5FF; }
    .mini-btn.active-src {
      background: #00E5FF;
      color: #000;
      font-weight: bold;
      border-color: #00E5FF;
    }
    #scope-canvas {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    .scope-footer {
      background: rgba(0,0,0,0.4);
      padding: 4px 8px;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      color: #aaa;
    }
    .scope-val-badge {
      font-family: monospace;
      color: #00E5FF;
      font-weight: bold;
    }
    .wave-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px; background: #161920; }
    .wave-chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
    .chip { font-size: 10px; padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .chip.selected { border-color: currentColor; font-weight: bold; background: rgba(255,255,255,0.12); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    #wave-canvas { width: 100%; height: 100%; cursor: pointer; }

    /* Bottom Toolbar */
    #bottom-toolbar { background: #1E222B; padding: 6px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,0.08); }
    .tool-row { display: flex; align-items: center; justify-content: space-between; }
    .tool-group { display: flex; gap: 4px; align-items: center; }
    .tool-btn { background: #262C38; border: 1px solid rgba(255,255,255,0.1); color: #aaa; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; }
    .tool-btn.active { background: #FFD600; color: #000; font-weight: bold; border-color: #FFD600; }
    .color-dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.active { border-color: #fff; }
  </style>
</head>
<body>

  <!-- 1. Header -->
  <header>
    <div class="logo-area">
      <span>⚡ MotionSync Analytics</span>
      <span style="font-size: 11px; color: #888; margin-left: 8px;">(石井 更紗 - 秋季記録会)</span>
    </div>
    <div class="mode-selector">
      <button class="mode-btn" onclick="setViewMode('single')">1画面</button>
      <button class="mode-btn active" onclick="setViewMode('split')">並列比較</button>
      <button class="mode-btn" onclick="setViewMode('ghost')">透過ゴースト</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="menu-btn" id="hud-overlay-btn" onclick="toggleScopeOverlay()" style="background:#262C38; border-color:#00E5FF; color:#00E5FF; font-weight:bold;">📱 HUDオーバーレイ: OFF</button>
      <button class="menu-btn" onclick="saveProjectJson()">💾 保存</button>
      <button class="menu-btn" onclick="capturePng()">📸 PNG保存</button>
    </div>
  </header>

  <!-- 2. Video Viewport -->
  <div id="viewport-container">
    <div id="ghost-slider-panel">
      <span>透過度: <span id="ghost-val">50%</span></span>
      <input type="range" id="ghost-range" min="0" max="100" value="50" oninput="updateGhost(this.value)" style="width:90px; accent-color:#7C4DFF;">
    </div>

    <!-- HUD Scope Overlay (スマホ横向き向け波形オーバーレイ) -->
    <div id="scope-overlay-hud">
      <div class="scope-header">
        <div class="scope-title">
          <span>📊 波形スコープ</span>
          <span id="scope-range-badge" style="color:#aaa; font-weight:normal; font-size:10px;">(±2.0秒)</span>
        </div>
        <div class="scope-ctrls">
          <div class="mode-selector" style="font-size:9px; margin-right:4px;">
            <button class="mini-btn active-src" id="src-scope-both" onclick="setWaveSource('both')">A&B重畳</button>
            <button class="mini-btn" id="src-scope-a" onclick="setWaveSource('A')">A自身</button>
            <button class="mini-btn" id="src-scope-b" onclick="setWaveSource('B')">B比較</button>
          </div>
          <button class="mini-btn" onclick="cycleScopeWindow()" title="表示秒数切替"><span id="btn-sec-val">±2s</span></button>
          <button class="mini-btn" onclick="toggleScopePosition()" title="左右位置反転">⇄</button>
          <button class="mini-btn" onclick="toggleScopeOpacity()" title="透過度切替">半透明</button>
          <button class="mini-btn" onclick="toggleScopeOverlay()" style="color:#FF5252;">✕</button>
        </div>
      </div>
      <canvas id="scope-canvas"></canvas>
      <div class="scope-footer" style="flex-direction:column; gap:2px; font-size:9px;">
        <div style="display:flex; justify-content:space-between; width:100%;">
          <span>自選手 A: <span id="scope-val-a" style="color:#00E5FF; font-family:monospace; font-weight:bold;">0.00 G</span></span>
          <span>お手本 B: <span id="scope-val-b" style="color:#FF5252; font-family:monospace; font-weight:bold;">0.00 G</span></span>
        </div>
        <div style="display:flex; justify-content:space-between; width:100%; border-top:1px dashed rgba(255,255,255,0.1); padding-top:2px;">
          <span>差分 Δ(A-B): <span id="scope-diff-val" style="color:#FFD600; font-family:monospace; font-weight:bold;">0.00 G</span></span>
          <span style="color:#888;">実線=A / 破線=B</span>
        </div>
      </div>
    </div>

    <!-- Video A -->
    <div class="video-box" id="boxA" style="color: #00E5FF;">
      <div class="video-badge">動画 A (自選手) <span id="timeA" style="margin-left:6px; color:#fff; font-family:monospace;">00:00.00</span></div>
      <div class="dummy-athlete" id="athleteA">
        <div class="dummy-head"></div>
        <div class="dummy-body">
          <div class="dummy-limb" style="transform: rotate(25deg); left: -10px;"></div>
          <div class="dummy-limb" style="transform: rotate(-35deg); right: -10px;"></div>
        </div>
      </div>
    </div>

    <!-- Video B -->
    <div class="video-box" id="boxB" style="color: #FF5252;">
      <div class="video-badge b">動画 B (お手本) <span id="timeB" style="margin-left:6px; color:#fff; font-family:monospace;">00:00.60</span></div>
      <div class="dummy-athlete" id="athleteB">
        <div class="dummy-head"></div>
        <div class="dummy-body">
          <div class="dummy-limb" style="transform: rotate(40deg); left: -12px;"></div>
          <div class="dummy-limb" style="transform: rotate(-20deg); right: -12px;"></div>
        </div>
      </div>
    </div>

    <!-- Annotation & Grid Canvas -->
    <canvas id="draw-canvas"></canvas>
  </div>

  <!-- 3. Playback Controls -->
  <div id="playback-bar">
    <div class="seek-row">
      <span id="cur-pos-text">00:00.00</span>
      <input type="range" id="seek-bar" class="seek-slider" min="0" max="10000" value="0" oninput="onSeekSlider(this.value)">
      <span>00:10.00</span>
    </div>
    <div class="ctrl-row">
      <button class="btn active-lock" id="lock-btn" onclick="toggleLock()">🔒 同期ロック中</button>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn" onclick="stepFrame(-33)">◀ 1コマ戻し</button>
        <button class="play-circle" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="btn" onclick="stepFrame(33)">1コマ送り ▶</button>
      </div>
      <select class="btn" id="speed-select" onchange="setSpeed(this.value)">
        <option value="0.1">0.10x スロー</option>
        <option value="0.25" selected>0.25x スロー</option>
        <option value="0.5">0.50x スロー</option>
        <option value="1.0">1.00x 通常</option>
      </select>
    </div>
  </div>

  <!-- 4. HUD Bar -->
  <div id="hud-bar">
    <div style="display:flex; align-items:center;">
      <div class="hud-lap" id="hud-lap-text">LAP 1: 0:03.20</div>
      <div class="hud-diff" id="hud-diff-text">Diff: -0.15s (先行)</div>
    </div>
    <div class="hud-gauge">
      <span>合成G: <span id="hud-g-val">1.24 G</span></span>
      <div class="gauge-bar">
        <div class="gauge-fill" id="hud-g-fill"></div>
      </div>
    </div>
  </div>

  <!-- 5. Sensor Waveform Area -->
  <div id="waveform-area">
    <div class="wave-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:11px; font-weight:bold; color:#00E5FF;">波形系列:</span>
        <!-- 表示対象セレクター (A / B / Both) -->
        <div class="mode-selector" style="font-size:10px;">
          <button class="mini-btn active-src" id="src-btn-both" onclick="setWaveSource('both')">A & B 重畳比較</button>
          <button class="mini-btn" id="src-btn-a" onclick="setWaveSource('A')">動画A (自選手) のみ</button>
          <button class="mini-btn" id="src-btn-b" onclick="setWaveSource('B')">動画B (お手本) のみ</button>
        </div>
        <span style="font-size:10px; color:#888; margin-left:4px;">(― 実線: A / --- 破線: B)</span>
      </div>
      <div class="wave-chips" id="wave-chips-container">
        <!-- JS動的生成 -->
      </div>
    </div>
    <div style="flex:1; position:relative;">
      <canvas id="wave-canvas"></canvas>
    </div>
  </div>

  <!-- 6. Bottom Toolbar -->
  <div id="bottom-toolbar">
    <div class="tool-row">
      <div class="tool-group">
        <button class="tool-btn" id="grid-btn" onclick="toggleGrid()">▦ 方眼グリッド</button>
        <button class="tool-btn" id="plumb-btn" onclick="togglePlumb()">┃ 鉛直プラムライン</button>
      </div>
      <div class="tool-group">
        <span style="font-size:10px; color:#888;">同期オフセット:</span>
        <button class="tool-btn" onclick="adjustOffset(-0.05)">-0.05s</button>
        <button class="tool-btn" onclick="adjustOffset(-0.01)">-0.01s</button>
        <span id="offset-badge" style="font-family:monospace; font-size:11px; color:#FFD600; font-weight:bold;">+0.60s</span>
        <button class="tool-btn" onclick="adjustOffset(0.01)">+0.01s</button>
        <button class="tool-btn" onclick="adjustOffset(0.05)">+0.05s</button>
      </div>
    </div>
    <div class="tool-row">
      <div class="tool-group">
        <button class="tool-btn active" id="tool-select" onclick="setTool('none')">選択</button>
        <button class="tool-btn" id="tool-pen" onclick="setTool('pen')">ペン</button>
        <button class="tool-btn" id="tool-line" onclick="setTool('line')">直線</button>
        <button class="tool-btn" id="tool-arrow" onclick="setTool('arrow')">矢印</button>
        <button class="tool-btn" id="tool-angle" onclick="setTool('angle')">📐 角度計測(3点)</button>
        <button class="tool-btn" onclick="clearDrawings()" style="color:#FF5252;">消去</button>
      </div>
      <div class="tool-group">
        <div class="color-dot active" style="background:#FFD600;" onclick="setColor('#FFD600', this)"></div>
        <div class="color-dot" style="background:#00E5FF;" onclick="setColor('#00E5FF', this)"></div>
        <div class="color-dot" style="background:#FF5252;" onclick="setColor('#FF5252', this)"></div>
        <div class="color-dot" style="background:#00E676;" onclick="setColor('#00E676', this)"></div>
      </div>
    </div>
  </div>

  <script>
    // --- 状態管理 ---
    let viewMode = 'split';
    let isPlaying = false;
    let playbackSpeed = 0.25;
    let isSyncLocked = true;
    let currentMs = 0;
    let baseOffsetMs = 600; // 0.6s
    let manualOffsetSec = 0.0;
    const totalMs = 10000;

    let showGrid = false;
    let showPlumb = false;
    let activeTool = 'none';
    let strokeColor = '#FFD600';
    let drawingObjects = [];
    let currentPoints = [];

    // 波形系列定義 (全12系統)
    const WAVE_SERIES = [
      { id: 'accX', label: 'Acc X', color: '#FF5252', unit: 'g', selected: true },
      { id: 'accY', label: 'Acc Y', color: '#69F0AE', unit: 'g', selected: true },
      { id: 'accZ', label: 'Acc Z', color: '#40C4FF', unit: 'g', selected: true },
      { id: 'accTotal', label: 'Acc 合成G', color: '#FFD740', unit: 'g', selected: true },
      { id: 'gyrX', label: 'Gyro X', color: '#FF9100', unit: '°/s', selected: false },
      { id: 'gyrY', label: 'Gyro Y', color: '#00E676', unit: '°/s', selected: false },
      { id: 'gyrZ', label: 'Gyro Z', color: '#448AFF', unit: '°/s', selected: false },
      { id: 'gyrTotal', label: 'Gyro 合成', color: '#FF4081', unit: '°/s', selected: false },
      { id: 'angX', label: 'Angle X', color: '#E040FB', unit: '°', selected: false },
      { id: 'angY', label: 'Angle Y', color: '#18FFFF', unit: '°', selected: false },
      { id: 'angZ', label: 'Angle Z', color: '#EEFF41', unit: '°', selected: false },
      { id: 'angTotal', label: 'Angle 合成', color: '#FFFFFF', unit: '°', selected: false },
    ];

    // 表示対象セレクター (both: 重畳, A: 自身のみ, B: 比較対象のみ)
    let waveSource = 'both';

    function setWaveSource(src) {
      waveSource = src;
      // 下部パネルのボタン更新
      document.querySelectorAll('#waveform-area .mini-btn').forEach(b => b.classList.remove('active-src'));
      const btn = document.getElementById(`src-btn-${src.toLowerCase()}`);
      if (btn) btn.classList.add('active-src');

      // スコープパネルのボタン更新
      document.querySelectorAll('#scope-overlay-hud .mini-btn').forEach(b => b.classList.remove('active-src'));
      const sbtn = document.getElementById(`src-scope-${src.toLowerCase()}`);
      if (sbtn) sbtn.classList.add('active-src');

      updateUI();
    }

    // サンプルセンサーデータ生成 (100Hz相当: 100件)
    // 1. 動画A用 (自選手)
    const sensorDataA = [];
    for (let i = 0; i < 100; i++) {
      const t = i * 0.1;
      const ax = Math.sin(t * 2) * 1.5;
      const ay = Math.cos(t * 2) * 0.8;
      const az = 1.0 + Math.sin(t * 4) * 0.5;
      const totalG = Math.sqrt(ax * ax + ay * ay + az * az);

      const gx = Math.cos(t * 2) * 280;
      const gy = Math.sin(t * 3) * 190;
      const gz = Math.cos(t * 1.5) * 140;
      const totalGyr = Math.sqrt(gx * gx + gy * gy + gz * gz);

      const roll = Math.sin(t) * 32;
      const pitch = Math.cos(t * 1.2) * 22;
      const yaw = ((i * 3.6) % 360) - 180;
      const totalAng = Math.sqrt(roll * roll + pitch * pitch + yaw * yaw);

      sensorDataA.push({ ms: i * 100, ax, ay, az, totalG, gx, gy, gz, totalGyr, roll, pitch, yaw, totalAng });
    }

    // 2. 動画B用 (比較対象 / お手本: より鋭いピーク・高回転)
    const sensorDataB = [];
    for (let i = 0; i < 100; i++) {
      const t = i * 0.1;
      // お手本は踏み込みが鋭く、ピークが大きい
      const ax = Math.sin(t * 2.1) * 1.9;
      const ay = Math.cos(t * 2.1) * 1.1;
      const az = 1.0 + Math.sin(t * 4.2) * 0.8;
      const totalG = Math.sqrt(ax * ax + ay * ay + az * az);

      const gx = Math.cos(t * 2.1) * 360;
      const gy = Math.sin(t * 3.1) * 240;
      const gz = Math.cos(t * 1.6) * 180;
      const totalGyr = Math.sqrt(gx * gx + gy * gy + gz * gz);

      const roll = Math.sin(t * 1.05) * 40;
      const pitch = Math.cos(t * 1.25) * 28;
      const yaw = ((i * 3.8) % 360) - 180;
      const totalAng = Math.sqrt(roll * roll + pitch * pitch + yaw * yaw);

      sensorDataB.push({ ms: i * 100, ax, ay, az, totalG, gx, gy, gz, totalGyr, roll, pitch, yaw, totalAng });
    }

    // 初期化
    window.addEventListener('load', () => {
      initWaveChips();
      resizeCanvases();
      updateUI();
      window.addEventListener('resize', resizeCanvases);
      initCanvasEvents();
    });

    function resizeCanvases() {
      const container = document.getElementById('viewport-container');
      const dCanvas = document.getElementById('draw-canvas');
      dCanvas.width = container.clientWidth;
      dCanvas.height = container.clientHeight;
      drawAnnotations();

      const wCanvas = document.getElementById('wave-canvas');
      if (wCanvas && wCanvas.parentElement) {
        wCanvas.width = wCanvas.parentElement.clientWidth;
        wCanvas.height = wCanvas.parentElement.clientHeight;
        drawWaveform();
      }

      const sCanvas = document.getElementById('scope-canvas');
      if (sCanvas && sCanvas.parentElement) {
        sCanvas.width = sCanvas.parentElement.clientWidth;
        sCanvas.height = sCanvas.parentElement.clientHeight - 62;
        if (isScopeOverlay) drawScopeWaveform();
      }
    }

    // --- 波形チップ生成 ---
    function initWaveChips() {
      const container = document.getElementById('wave-chips-container');
      container.innerHTML = '';
      WAVE_SERIES.forEach(s => {
        const chip = document.createElement('div');
        chip.className = `chip ${s.selected ? 'selected' : ''}`;
        chip.style.color = s.color;
        chip.innerHTML = `<span class="dot"></span>${s.label}`;
        chip.onclick = () => {
          s.selected = !s.selected;
          chip.classList.toggle('selected', s.selected);
          drawWaveform();
        };
        container.appendChild(chip);
      });
    }

    // --- 表示モード切替 ---
    function setViewMode(mode) {
      viewMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const boxA = document.getElementById('boxA');
      const boxB = document.getElementById('boxB');
      const slider = document.getElementById('ghost-slider-panel');

      if (mode === 'single') {
        boxA.style.display = 'flex';
        boxB.style.display = 'none';
        slider.style.display = 'none';
        boxB.style.opacity = '1';
      } else if (mode === 'split') {
        boxA.style.display = 'flex';
        boxB.style.display = 'flex';
        slider.style.display = 'none';
        boxA.style.position = 'relative';
        boxB.style.position = 'relative';
        boxB.style.opacity = '1';
      } else if (mode === 'ghost') {
        boxA.style.display = 'flex';
        boxB.style.display = 'flex';
        slider.style.display = 'flex';
        boxA.style.position = 'absolute';
        boxA.style.width = '100%';
        boxA.style.height = '100%';
        boxB.style.position = 'absolute';
        boxB.style.width = '100%';
        boxB.style.height = '100%';
        updateGhost(document.getElementById('ghost-range').value);
      }
      resizeCanvases();
    }

    function updateGhost(val) {
      document.getElementById('ghost-val').innerText = `${val}%`;
      if (viewMode === 'ghost') {
        document.getElementById('boxB').style.opacity = val / 100;
      }
    }

    // --- 再生エンジン・ループ ---
    let lastTime = 0;
    function animLoop(time) {
      if (isPlaying) {
        if (!lastTime) lastTime = time;
        const delta = (time - lastTime) * playbackSpeed;
        lastTime = time;
        currentMs += delta;
        if (currentMs > totalMs) currentMs = 0;
        updateUI();
        requestAnimationFrame(animLoop);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('play-btn').innerText = isPlaying ? '❚❚' : '▶';
      if (isPlaying) {
        lastTime = 0;
        requestAnimationFrame(animLoop);
      }
    }

    function stepFrame(ms) {
      if (isPlaying) togglePlay();
      currentMs = Math.max(0, Math.min(totalMs, currentMs + ms));
      updateUI();
    }

    function setSpeed(v) {
      playbackSpeed = parseFloat(v);
    }

    function toggleLock() {
      isSyncLocked = !isSyncLocked;
      const btn = document.getElementById('lock-btn');
      btn.innerText = isSyncLocked ? '🔒 同期ロック中' : '🔓 個別調整中';
      btn.classList.toggle('active-lock', isSyncLocked);
    }

    function adjustOffset(sec) {
      manualOffsetSec += sec;
      const sign = manualOffsetSec >= 0 ? '+' : '';
      document.getElementById('offset-badge').innerText = `${sign}${manualOffsetSec.toFixed(2)}s`;
      updateUI();
    }

    function onSeekSlider(val) {
      currentMs = parseInt(val);
      updateUI();
    }

    function updateUI() {
      // タイムコード更新
      const fmt = ms => {
        const d = new Date(ms);
        const m = String(d.getMinutes()).padStart(2, '0');
        const s = String(d.getSeconds()).padStart(2, '0');
        const f = String(Math.floor(d.getMilliseconds() / 10)).padStart(2, '0');
        return `${m}:${s}.${f}`;
      };

      document.getElementById('timeA').innerText = fmt(currentMs);
      const posB = isSyncLocked ? Math.max(0, currentMs + baseOffsetMs + (manualOffsetSec * 1000)) : currentMs;
      document.getElementById('timeB').innerText = fmt(posB);
      document.getElementById('cur-pos-text').innerText = fmt(currentMs);
      document.getElementById('seek-bar').value = currentMs;

      // 擬似アスリートのアニメーション (動画代用)
      const ang = Math.sin(currentMs / 300) * 35;
      document.querySelector('#athleteA .dummy-limb:first-child').style.transform = `rotate(${ang}deg)`;
      document.querySelector('#athleteA .dummy-limb:last-child').style.transform = `rotate(${-ang}deg)`;
      document.querySelector('#athleteB .dummy-limb:first-child').style.transform = `rotate(${ang + 15}deg)`;
      document.querySelector('#athleteB .dummy-limb:last-child').style.transform = `rotate(${-ang - 15}deg)`;

      // 二分探索で動画A・動画Bの最新センサーデータ取得
      const nearestA = findNearestSensor(sensorDataA, currentMs);
      const nearestB = findNearestSensor(sensorDataB, posB);

      if (nearestA && nearestB) {
        const diffG = nearestA.totalG - nearestB.totalG;
        const sign = diffG >= 0 ? '+' : '';
        document.getElementById('hud-g-val').innerText = `A:${nearestA.totalG.toFixed(2)}G / B:${nearestB.totalG.toFixed(2)}G (Δ${sign}${diffG.toFixed(2)}G)`;
        const pctA = Math.min(100, (nearestA.totalG / 3.0) * 100);
        document.getElementById('hud-g-fill').style.width = `${pctA}%`;
      }

      // HUD ラップ情報
      if (currentMs < 3200) {
        document.getElementById('hud-lap-text').innerText = 'LAP 1: 0:03.20';
        document.getElementById('hud-diff-text').innerText = 'Diff: -0.15s (先行)';
      } else if (currentMs < 6300) {
        document.getElementById('hud-lap-text').innerText = 'LAP 2: 0:03.10 (最速)';
        document.getElementById('hud-diff-text').innerText = 'Diff: -0.22s (先行)';
      } else {
        document.getElementById('hud-lap-text').innerText = 'LAP 3: 0:03.40';
        document.getElementById('hud-diff-text').innerText = 'Diff: -0.18s (先行)';
      }

      drawWaveform();
      if (isScopeOverlay) drawScopeWaveform();
    }

    // --- スコープHUDオーバーレイ制御 ---
    let isScopeOverlay = false;
    let scopePosition = 'right'; // 'right' or 'left'
    let scopeWindowSec = 2.0;    // 前後±2.0秒 (計4秒)
    let scopeOpacityMode = 0;    // 0: 0.85, 1: 0.60, 2: 0.35

    function toggleScopeOverlay() {
      isScopeOverlay = !isScopeOverlay;
      const btn = document.getElementById('hud-overlay-btn');
      const hud = document.getElementById('scope-overlay-hud');
      const waveArea = document.getElementById('waveform-area');

      if (isScopeOverlay) {
        btn.innerText = '📱 HUDオーバーレイ: ON';
        btn.style.background = '#00E5FF';
        btn.style.color = '#000';
        hud.style.display = 'flex';
        waveArea.classList.add('collapsed');
      } else {
        btn.innerText = '📱 HUDオーバーレイ: OFF';
        btn.style.background = '#262C38';
        btn.style.color = '#00E5FF';
        hud.style.display = 'none';
        waveArea.classList.remove('collapsed');
      }
      resizeCanvases();
      updateUI();
    }

    function toggleScopePosition() {
      scopePosition = scopePosition === 'right' ? 'left' : 'right';
      const hud = document.getElementById('scope-overlay-hud');
      hud.classList.toggle('pos-left', scopePosition === 'left');
    }

    function cycleScopeWindow() {
      if (scopeWindowSec === 2.0) scopeWindowSec = 1.0;
      else if (scopeWindowSec === 1.0) scopeWindowSec = 3.0;
      else scopeWindowSec = 2.0;

      document.getElementById('scope-range-badge').innerText = `(±${scopeWindowSec.toFixed(1)}秒)`;
      document.getElementById('btn-sec-val').innerText = `±${scopeWindowSec.toFixed(0)}s`;
      drawScopeWaveform();
    }

    function toggleScopeOpacity() {
      scopeOpacityMode = (scopeOpacityMode + 1) % 3;
      const opacities = [0.85, 0.60, 0.35];
      const hud = document.getElementById('scope-overlay-hud');
      hud.style.background = `rgba(15, 18, 24, ${opacities[scopeOpacityMode]})`;
    }

    function drawScopeWaveform() {
      const canvas = document.getElementById('scope-canvas');
      if (!canvas || !isScopeOverlay) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const windowMs = scopeWindowSec * 1000;
      const startMs = currentMs - windowMs;
      const endMs = currentMs + windowMs;

      // 時間目盛ライン（0.5秒刻み）
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      const stepMs = 500;
      const firstGrid = Math.ceil(startMs / stepMs) * stepMs;
      for (let t = firstGrid; t <= endMs; t += stepMs) {
        const x = ((t - startMs) / (windowMs * 2)) * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();

        const diffSec = (t - currentMs) / 1000;
        if (Math.abs(diffSec) > 0.1) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.font = '9px monospace';
          const label = (diffSec > 0 ? '+' : '') + diffSec.toFixed(1) + 's';
          ctx.fillText(label, x - 10, h - 4);
        }
      }

      // 中央ゼロ水平線
      const midY = h / 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();

      const posB = isSyncLocked ? Math.max(0, currentMs + baseOffsetMs + (manualOffsetSec * 1000)) : currentMs;
      const startMsB = posB - windowMs;
      const endMsB = posB + windowMs;

      // 1. 動画A (自選手: 実線) の描画
      if (waveSource === 'both' || waveSource === 'A') {
        const scopeDataA = sensorDataA.filter(d => d.ms >= startMs && d.ms <= endMs);
        const activeSeries = WAVE_SERIES.filter(s => s.selected);
        activeSeries.forEach(series => {
          ctx.strokeStyle = series.color;
          ctx.lineWidth = 2.2;
          ctx.setLineDash([]);
          ctx.beginPath();

          let scaleY = 30;
          if (series.id.startsWith('acc')) scaleY = h / 7;
          else if (series.id.startsWith('gyr')) scaleY = h / 900;
          else if (series.id.startsWith('ang')) scaleY = h / 380;

          scopeDataA.forEach((rec, idx) => {
            const x = ((rec.ms - startMs) / (windowMs * 2)) * w;
            let val = getRecordValue(rec, series.id);
            const y = Math.max(4, Math.min(h - 4, midY - (val * scaleY)));
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      }

      // 2. 動画B (比較対象/お手本: 破線) の描画
      if (waveSource === 'both' || waveSource === 'B') {
        const scopeDataB = sensorDataB.filter(d => d.ms >= startMsB && d.ms <= endMsB);
        const activeSeries = WAVE_SERIES.filter(s => s.selected);
        activeSeries.forEach(series => {
          ctx.strokeStyle = series.color;
          ctx.lineWidth = 1.8;
          ctx.setLineDash([5, 3]); // 破線
          ctx.beginPath();

          let scaleY = 30;
          if (series.id.startsWith('acc')) scaleY = h / 7;
          else if (series.id.startsWith('gyr')) scaleY = h / 900;
          else if (series.id.startsWith('ang')) scaleY = h / 380;

          scopeDataB.forEach((rec, idx) => {
            const x = ((rec.ms - startMsB) / (windowMs * 2)) * w;
            let val = getRecordValue(rec, series.id);
            const y = Math.max(4, Math.min(h - 4, midY - (val * scaleY)));
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      // 中央 NOW マーカー (赤い現在時刻縦線)
      const centerX = w / 2;
      ctx.strokeStyle = '#FF5252';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 2]);
      ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, h); ctx.stroke();
      ctx.setLineDash([]);

      // 現在マーカーバッジ
      ctx.fillStyle = '#FF5252';
      ctx.fillRect(centerX - 16, 2, 32, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('NOW', centerX - 10, 12);

      // スコープフッター数値更新 (A vs B リアルタイム差分)
      const curA = findNearestSensor(sensorDataA, currentMs);
      const curB = findNearestSensor(sensorDataB, posB);
      if (curA && curB) {
        document.getElementById('scope-val-a').innerText = `${curA.totalG.toFixed(2)} G`;
        document.getElementById('scope-val-b').innerText = `${curB.totalG.toFixed(2)} G`;
        const diff = curA.totalG - curB.totalG;
        const sign = diff >= 0 ? '+' : '';
        document.getElementById('scope-diff-val').innerText = `${sign}${diff.toFixed(2)} G (${diff >= 0 ? '自選手大' : 'お手本大'})`;
      }
    }

    function getRecordValue(rec, seriesId) {
      if (seriesId === 'accX') return rec.ax;
      if (seriesId === 'accY') return rec.ay;
      if (seriesId === 'accZ') return rec.az;
      if (seriesId === 'accTotal') return rec.totalG;
      if (seriesId === 'gyrX') return rec.gx;
      if (seriesId === 'gyrY') return rec.gy;
      if (seriesId === 'gyrZ') return rec.gz;
      if (seriesId === 'gyrTotal') return rec.totalGyr;
      if (seriesId === 'angX') return rec.roll;
      if (seriesId === 'angY') return rec.pitch;
      if (seriesId === 'angZ') return rec.yaw;
      if (seriesId === 'angTotal') return rec.totalAng;
      return 0;
    }

    function findNearestSensor(dataList, targetMs) {
      if (!dataList || dataList.length === 0) return null;
      let low = 0, high = dataList.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (dataList[mid].ms === targetMs) return dataList[mid];
        if (dataList[mid].ms < targetMs) low = mid + 1;
        else high = mid - 1;
      }
      if (low >= dataList.length) return dataList[high];
      if (high < 0) return dataList[low];
      return Math.abs(dataList[low].ms - targetMs) < Math.abs(dataList[high].ms - targetMs) ? dataList[low] : dataList[high];
    }

    // --- 波形キャンバス描画 (下部メインパネル) ---
    function drawWaveform() {
      const canvas = document.getElementById('wave-canvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const midY = h / 2;
      // 0基準ライン
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, midY); ctx.lineTo(w, midY);
      ctx.stroke();

      const activeSeries = WAVE_SERIES.filter(s => s.selected);

      // 1. 動画Aの波形描画 (自選手: 実線)
      if (waveSource === 'both' || waveSource === 'A') {
        activeSeries.forEach(series => {
          ctx.strokeStyle = series.color;
          ctx.lineWidth = series.id.includes('Total') ? 2.2 : 1.2;
          ctx.setLineDash([]);
          ctx.beginPath();

          let scaleY = 16.0;
          if (series.unit === '°/s') scaleY = 0.08;
          if (series.unit === '°') scaleY = 0.25;

          for (let i = 0; i < sensorDataA.length; i++) {
            const rec = sensorDataA[i];
            const x = (rec.ms / totalMs) * w;
            const val = getRecordValue(rec, series.id);
            const y = Math.max(2, Math.min(h - 2, midY - (val * scaleY)));
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
      }

      // 2. 動画Bの波形描画 (比較対象/お手本: 破線)
      if (waveSource === 'both' || waveSource === 'B') {
        activeSeries.forEach(series => {
          ctx.strokeStyle = series.color;
          ctx.lineWidth = series.id.includes('Total') ? 1.8 : 1.0;
          ctx.setLineDash([5, 3]); // 破線
          ctx.beginPath();

          let scaleY = 16.0;
          if (series.unit === '°/s') scaleY = 0.08;
          if (series.unit === '°') scaleY = 0.25;

          for (let i = 0; i < sensorDataB.length; i++) {
            const rec = sensorDataB[i];
            const x = (rec.ms / totalMs) * w;
            const val = getRecordValue(rec, series.id);
            const y = Math.max(2, Math.min(h - 2, midY - (val * scaleY)));
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      // 再生ヘッド A (黄色縦ライン: 自選手)
      if (waveSource === 'both' || waveSource === 'A') {
        const headXA = (currentMs / totalMs) * w;
        ctx.strokeStyle = '#FFD600';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(headXA, 0); ctx.lineTo(headXA, h);
        ctx.stroke();

        ctx.fillStyle = '#FFD600';
        ctx.beginPath();
        ctx.moveTo(headXA - 5, 0); ctx.lineTo(headXA + 5, 0); ctx.lineTo(headXA, 7);
        ctx.fill();
      }

      // 再生ヘッド B (赤色破線縦ライン: お手本の同期位置)
      if (waveSource === 'both' || waveSource === 'B') {
        const posB = isSyncLocked ? Math.max(0, currentMs + baseOffsetMs + (manualOffsetSec * 1000)) : currentMs;
        const headXB = (posB / totalMs) * w;
        ctx.strokeStyle = '#FF5252';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([4, 2]);
        ctx.beginPath();
        ctx.moveTo(headXB, 0); ctx.lineTo(headXB, h);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#FF5252';
        ctx.beginPath();
        ctx.moveTo(headXB - 5, h); ctx.lineTo(headXB + 5, h); ctx.lineTo(headXB, h - 7);
        ctx.fill();
      }

    // 波形キャンバスクリックでシーク
    document.getElementById('wave-canvas').onclick = e => {
      const rect = e.target.getBoundingClientRect();
      const frac = (e.clientX - rect.left) / rect.width;
      currentMs = Math.max(0, Math.min(totalMs, frac * totalMs));
      updateUI();
    };

    // --- アノテーション＆グリッド描画 ---
    function setTool(t) {
      activeTool = t;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`tool-${t}`);
      if (btn) btn.classList.add('active');
      currentPoints = [];
    }

    function setColor(c, el) {
      strokeColor = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function toggleGrid() {
      showGrid = !showGrid;
      document.getElementById('grid-btn').classList.toggle('active', showGrid);
      drawAnnotations();
    }

    function togglePlumb() {
      showPlumb = !showPlumb;
      document.getElementById('plumb-btn').classList.toggle('active', showPlumb);
      drawAnnotations();
    }

    function clearDrawings() {
      drawingObjects = [];
      currentPoints = [];
      drawAnnotations();
    }

    function initCanvasEvents() {
      const canvas = document.getElementById('draw-canvas');
      let isDrawing = false;

      canvas.onmousedown = e => {
        if (activeTool === 'none') return;
        const rect = canvas.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };

        if (activeTool === 'angle') {
          currentPoints.push(pt);
          if (currentPoints.length === 3) {
            const angle = calcAngle(currentPoints[0], currentPoints[1], currentPoints[2]);
            drawingObjects.push({ type: 'angle', points: [...currentPoints], color: strokeColor, angle });
            currentPoints = [];
          }
          drawAnnotations();
          return;
        }

        isDrawing = true;
        currentPoints = [pt];
      };

      canvas.onmousemove = e => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        if (activeTool === 'pen') {
          currentPoints.push(pt);
        } else {
          currentPoints[1] = pt;
        }
        drawAnnotations();
      };

      window.onmouseup = () => {
        if (isDrawing && currentPoints.length > 1) {
          drawingObjects.push({ type: activeTool, points: [...currentPoints], color: strokeColor });
          currentPoints = [];
        }
        isDrawing = false;
        drawAnnotations();
      };
    }

    function calcAngle(pA, pB, pC) {
      const v1x = pA.x - pB.x, v1y = pA.y - pB.y;
      const v2x = pC.x - pB.x, v2y = pC.y - pB.y;
      const dot = v1x * v2x + v1y * v2y;
      const len1 = Math.sqrt(v1x * v1x + v1y * v1y);
      const len2 = Math.sqrt(v2x * v2x + v2y * v2y);
      if (len1 === 0 || len2 === 0) return 0;
      const cosT = Math.max(-1, Math.min(1, dot / (len1 * len2)));
      return (Math.acos(cosT) * (180 / Math.PI)).toFixed(1);
    }

    function drawAnnotations() {
      const canvas = document.getElementById('draw-canvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // 方眼グリッド
      if (showGrid) {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)';
        ctx.lineWidth = 0.8;
        for (let x = 0; x < w; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
      }

      // 鉛直プラムライン & 水平線
      if (showPlumb) {
        ctx.strokeStyle = 'rgba(255, 82, 82, 0.7)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      }

      // 確定オブジェクト
      [...drawingObjects, currentPoints.length ? { type: activeTool, points: currentPoints, color: strokeColor } : null]
        .filter(Boolean)
        .forEach(obj => {
          ctx.strokeStyle = obj.color;
          ctx.fillStyle = obj.color;
          ctx.lineWidth = 3;

          if (obj.type === 'pen' || obj.type === 'line') {
            ctx.beginPath();
            obj.points.forEach((p, idx) => {
              if (idx === 0) ctx.moveTo(p.x, p.y);
              else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
          } else if (obj.type === 'arrow' && obj.points.length >= 2) {
            const p1 = obj.points[0], p2 = obj.points[1];
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            ctx.beginPath();
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p2.x - 14 * Math.cos(ang - 0.4), p2.y - 14 * Math.sin(ang - 0.4));
            ctx.lineTo(p2.x - 14 * Math.cos(ang + 0.4), p2.y - 14 * Math.sin(ang + 0.4));
            ctx.fill();
          } else if (obj.type === 'angle') {
            ctx.beginPath();
            obj.points.forEach((p, idx) => {
              ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
              if (idx > 0) {
                ctx.moveTo(obj.points[idx-1].x, obj.points[idx-1].y);
                ctx.lineTo(p.x, p.y);
              }
            });
            ctx.stroke();
            if (obj.angle) {
              const b = obj.points[1];
              ctx.fillStyle = '#FFD600';
              ctx.fillRect(b.x + 8, b.y - 24, 60, 20);
              ctx.fillStyle = '#000';
              ctx.font = 'bold 12px sans-serif';
              ctx.fillText(`${obj.angle}°`, b.x + 14, b.y - 10);
            }
          }
        });
    }

    // --- エクスポート ---
    function capturePng() {
      alert('現在フレームの静止画 (PNG: 計測線・角度・HUD重畳) を書き出しました！');
    }

    function saveProjectJson() {
      const data = {
        projectId: 'PROJ_' + Date.now(),
        currentMs,
        viewMode,
        manualOffsetSec,
        selectedWaveforms: WAVE_SERIES.filter(s => s.selected).map(s => s.id),
        annotations: drawingObjects
      };
      navigator.clipboard.writeText(JSON.stringify(data, null, 2));
      alert('プロジェクト分析状態 (JSON) をクリップボードにコピーしました！');
    }
  </script>
