name: motionsync_analytics
description: "Sports Motion and Sensor Data Integrated Analysis Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # 動画再生エンジン (高精度スロー再生・ステップ送り・デュアル同期)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4

  # グラフ描画
  fl_chart: ^0.68.0

  # データ永続化 (プロジェクト設定・オフセット・描画保存)
  shared_preferences: ^2.2.3

  # アイコン・UIユーティリティ
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
